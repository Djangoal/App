name: Build APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          zip unzip openjdk-17-jdk python3-pip \
          git build-essential libncurses-dev libffi-dev \
          libssl-dev libsqlite3-dev libjpeg-dev \
          zlib1g-dev libpng-dev

    - name: Setup Python & install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Rename APK
      run: |
        APK_FILE=$(find bin/ -name "*.apk" | head -n 1)
        mv "$APK_FILE" "mon_budget_perso.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-apk
        path: ./mon_budget_perso.apk
