name: Build APK with Buildozer

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for buildozer.spec
        run: test -f buildozer.spec

      - name: Pull working Buildozer image
        run: docker pull kivy/buildozer:20221011

      - name: Build APK with Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
          -w /app kivy/buildozer:20221011 \
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: bin/*.apk
