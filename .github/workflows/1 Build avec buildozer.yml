name: Build Android (Buildozer/P4A)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Choisir le type de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    # ----------------------------
    # CHECKOUT
    # ----------------------------
    - name: Checkout code
      uses: actions/checkout@v3

    # ----------------------------
    # SYSTEM DEPENDENCIES
    # ----------------------------
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk \
        python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    # ----------------------------
    # PYTHON + P4A
    # ----------------------------
    - name: Setup Python & python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip setuptools cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    # ----------------------------
    # ANDROID SDK + NDK
    # ----------------------------
    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    # ----------------------------
    # CLEAN BUILDS
    # ----------------------------
    - name: Cleanup previous builds
      run: |
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true

    # ----------------------------
    # COPY MANIFEST CUSTOM
    # ----------------------------
    - name: Import custom AndroidManifest template
      run: |
        mkdir -p ~/.local/share/python-for-android/templates/
        cp app/templates/AndroidManifest.tmpl.xml ~/.local/share/python-for-android/templates/AndroidManifest.tmpl.xml

    # ----------------------------
    # BUILD APK
    # ----------------------------
    - name: Build APK
      run: |
        source venv/bin/activate

        echo "=== Build type: ${{ github.event.inputs.build_type }} ==="

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          ARCH="arm64-v8a"
          DIST="monapp_release"
          FLAGS="--release"
        else
          ARCH="armeabi-v7a"
          DIST="monapp_debug"
          FLAGS="--debug"
        fi

        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --arch=$ARCH \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=35 \
          --orientation=portrait \
          --dist-name=$DIST \
          $FLAGS

    # ----------------------------
    # FIND APK
    # ----------------------------
    - name: Locate built APK
      id: find_apk
      run: |
        APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_FILE" ]; then
          echo "❌ No APK found!"
          exit 1
        fi
        echo "APK found: $APK_FILE"
        echo "apk_path=$APK_FILE" >> $GITHUB_OUTPUT

    # ----------------------------
    # UPLOAD
    # ----------------------------
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ${{ steps.find_apk.outputs.apk_path }}
