

    ####################################
    # VERIFY APK
    ####################################
    - name: Verify APK content
      run: |
        echo "=== Vérification du contenu APK ==="

        APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
        echo "APK détecté : $APK_FILE"

        sudo apt-get install -y aapt

        echo "=== Classes Google Ads ==="
        unzip -l "$APK_FILE" | grep -E "gms|ads" || echo "⚠️ Aucune classe Google Ads trouvée"

        echo "=== Vérification Manifest : APPLICATION_ID (AdMob) ==="
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -i "APPLICATION_ID" || echo "⚠️ App ID AdMob manquant"

        echo "=== Vérification Permissions Réseau ==="
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -E "INTERNET|ACCESS_NETWORK_STATE" || echo "⚠️ Permissions manquantes"

        echo "=== Vérification SDK Google Ads présent ==="
        if unzip -l "$APK_FILE" | grep -q "com/google/android/gms/ads"; then
          echo "✔️ Google Ads détecté dans l’APK"
        else
          echo "❌ Google Ads ABSENT — le bandeau pub NE PEUT PAS fonctionner"
          exit 1
        fi

        echo "=== Vérification terminée ==="
    ###############################################
    #   📄 GÉNÉRATION DU RAPPORT HTML COMPLET
    ###############################################
    - name: Generate AdMob Diagnostics Report
      run: |
        echo "=== Génération du rapport HTML AdMob ==="

        APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
        REPORT="$GITHUB_WORKSPACE/report_admob.html"

        sudo apt-get install -y aapt unzip

        echo "<html><head><meta charset='UTF-8'><title>AdMob Diagnostics Report</title></head><body>" > "$REPORT"
        echo "<h1>📊 Rapport de diagnostic AdMob</h1>" >> "$REPORT"
        echo "<p><strong>APK analysé :</strong> $APK_FILE</p>" >> "$REPORT"
        echo "<hr>" >> "$REPORT"

        ######## Manifest
        echo "<h2>🧩 AndroidManifest.xml</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml >> "$REPORT" 2>&1
        echo "</pre><hr>" >> "$REPORT"

        ######## Permissions
        echo "<h2>🔐 Permissions détectées</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -E "uses-permission" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"

        ######## Rechercher App ID AdMob
        echo "<h2>📌 Recherche de l'AdMob App ID</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -i "APPLICATION_ID" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"

        ######## Classes Google Ads
        echo "<h2>📚 Classes Google Ads dans l'APK</h2><pre>" >> "$REPORT"
        unzip -l "$APK_FILE" | grep -i "com/google/android/gms/ads" >> "$REPORT" || echo "Aucune classe Ads" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"

        ######## Détection version Play Services Ads
        echo "<h2>🔎 Version du SDK Google Ads détectée</h2><pre>" >> "$REPORT"
        unzip -l "$APK_FILE" | grep -E "play-services-ads.*\.aar|ads-.*\.jar" >> "$REPORT" || echo "Impossible de détecter" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"

        ######## Listing complet APK
        echo "<h2>📦 Contenu complet de l'APK</h2><pre>" >> "$REPORT"
        unzip -l "$APK_FILE" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"

        echo "<p>⏳ Analyse terminée automatiquement via GitHub Actions.</p>" >> "$REPORT"
        echo "</body></html>" >> "$REPORT"

        echo "Rapport généré : $REPORT"

