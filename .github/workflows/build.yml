name: Build APK (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python and python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git@develop

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: 🧹 Cleanup previous builds
      run: |
        echo "🧹 Nettoyage complet..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android
        rm -rf ~/.gradle
        rm -rf ~/.cache
        echo "✅ Environnement propre et prêt."

    - name: 🔍 Vérification des fichiers nécessaires
      run: |
        echo "Vérification que le fichier Gradle existe..."
        if [ ! -f "$GITHUB_WORKSPACE/app/build.gradle" ]; then
          echo "⚠️ Le fichier app/build.gradle est manquant !"
          exit 1
        fi
        echo "✅ build.gradle trouvé !"

    - name: Build APK
      run: |
        source venv/bin/activate
        echo "🚀 Type de build : ${{ github.event.inputs.build_type }}"

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "=== Building unsigned RELEASE APK ==="
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --hook "$GITHUB_WORKSPACE/app/hooks/force_ads_dependency.py" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=arm64-v8a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp_release \
            --release

          APK_PATH=$(find . -type f -name "*release-unsigned*.apk" | head -n 1)
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK release trouvé !"
            find . -type f -name "*.apk"
            exit 1
          fi
          echo "✅ APK release trouvé : $APK_PATH"
          cp "$APK_PATH" "$FINAL_APK"

          $SDK_DIR/build-tools/36.0.0/zipalign -v 4 "$FINAL_APK" "${FINAL_APK%.apk}-aligned.apk"
          echo "✅ APK aligné : ${FINAL_APK%.apk}-aligned.apk"

        else
          echo "=== Building DEBUG APK ==="
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --hook "$GITHUB_WORKSPACE/app/hooks/force_ads_dependency.py" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp_debug \
            --debug

          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK debug trouvé !"
            find . -type f -name "*.apk"
            exit 1
          fi
          echo "✅ APK debug trouvé : $APK_PATH"
          cp "$APK_PATH" "$FINAL_APK"
        fi

    - name: 🔍 Vérification de la présence d'AdMob
      run: |
        echo "🔎 Vérification de la présence des classes Google Ads..."
        unzip -l mon_budget_perso_*_unsigned*.apk | grep -q "com/google/android/gms/ads" && \
          echo "✅ AdMob détecté dans l'APK !" || \
          (echo "❌ AdMob non trouvé dans l'APK — vérifie ton build.gradle !" && exit 1)

    - name: 📦 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk
