name: 5 Build APK release direct

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "release"
        type: choice
        options:
          - debug
          - release

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:

    - name: 🧩 Checkout repo
      uses: actions/checkout@v4

    - name: 📄 Vérifier buildozer.spec
      run: cat buildozer.spec

    - name: ▶️ Display selected build type
      run: echo "Selected build type: ${{ github.event.inputs.build_type }}"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: 🔧 Install Buildozer 1.4.0
      run: |
        python -m pip install --upgrade pip setuptools
        pip install cython==0.29.33
        pip install buildozer==1.4.0

    - name: 📱 Install Android SDK + Build tools (FORCÉS)
      run: |
        mkdir -p $HOME/Android/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O commandlinetools.zip
        unzip -o commandlinetools.zip -d $HOME/Android/cmdline-tools

        yes | $HOME/Android/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android --licenses

        # ⚠️ Installer UNIQUEMENT les versions demandées
        $HOME/Android/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;25.2.9519653"

    - name: 🔧 Configure Android env
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/Android" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/cmdline-tools/cmdline-tools/bin:$HOME/Android/platform-tools:$PATH" >> $GITHUB_ENV

    - name: 🧹 Clean previous builds
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: 🏗️ Build APK
      run: |
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "📦 Build RELEASE APK (non signé)"
          buildozer android release
        else
          echo "📦 Build DEBUG APK"
          buildozer android debug
        fi

    - name: 📂 Show outputs
      run: ls -lh ./bin

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./bin/*.apk
