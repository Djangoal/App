name: 01 Build APK 2026

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653
      ANDROID_API: "35"

    steps:

    # ============================================================
    # CHECKOUT
    # ============================================================
    - name: Checkout code
      uses: actions/checkout@v5

    # ============================================================
    # PYTHON 3.11
    # ============================================================
    - name: Setup Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    # ============================================================
    # JAVA 17
    # ============================================================
    - name: Setup Java 17
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: "17"

    # ============================================================
    # DEPENDANCES SYSTEME
    # ============================================================
    - name: Install system dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          libltdl-dev \
          zip \
          unzip \
          libncurses-dev \
          libtool \
          libtool-bin \
          automake \
          autoconf \
          pkg-config \
          m4 \
          curl \
          git

    # ============================================================
    # ENVIRONNEMENT PYTHON
    # ============================================================
    - name: Setup Python virtual environment
      run: |
        python -m venv venv

        source venv/bin/activate

        python -m pip install --upgrade pip setuptools wheel

        # ========================================================
        # IMPORTANT :
        # p4a 2024.01.21 nécessite sh < 2
        # ========================================================
        pip install "sh>=1.10,<2.0"

        # Cython compatible avec p4a 2024
        pip install "Cython==0.29.36"

        # Outils nécessaires à p4a
        pip install \
          appdirs \
          colorama \
          jinja2 \
          build \
          toml \
          packaging

        # ========================================================
        # PYTHON-FOR-ANDROID
        # ========================================================
        pip install --no-cache-dir \
          "python-for-android==2024.01.21"

        echo "========================================"
        echo "PYTHON"
        echo "========================================"

        python --version

        echo "========================================"
        echo "CYTHON"
        echo "========================================"

        cython --version

        echo "========================================"
        echo "SH"
        echo "========================================"

        python -c "import sh; print(sh.__version__)"

        echo "========================================"
        echo "P4A"
        echo "========================================"

        p4a --version

    # ============================================================
    # ANDROID SDK + NDK
    # ============================================================
    - name: Download Android SDK and NDK
      run: |
        mkdir -p "$SDK_DIR"

        curl -L \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          -o cmdline-tools.zip

        unzip -q cmdline-tools.zip -d "$SDK_DIR"

        mv "$SDK_DIR/cmdline-tools" \
           "$SDK_DIR/cmdline-tools-temp"

        mkdir -p "$SDK_DIR/cmdline-tools/latest"

        mv "$SDK_DIR/cmdline-tools-temp"/* \
           "$SDK_DIR/cmdline-tools/latest/"

        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"

        echo "========================================"
        echo "SDKMANAGER"
        echo "========================================"

        sdkmanager --version

        echo "========================================"
        echo "LICENSES"
        echo "========================================"

        yes | sdkmanager \
          --sdk_root="$SDK_DIR" \
          --licenses || true

        echo "========================================"
        echo "INSTALLATION SDK"
        echo "========================================"

        sdkmanager \
          --sdk_root="$SDK_DIR" \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    # ============================================================
    # VARIABLES ANDROID
    # ============================================================
    - name: Configure Android environment
      run: |
        echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

        echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

        echo "========================================"
        echo "ANDROID CONFIGURATION"
        echo "========================================"

        echo "SDK : $SDK_DIR"
        echo "NDK : $ANDROID_NDK_HOME"
        echo "API : $ANDROID_API"
        echo "JAVA: $JAVA_HOME"

    # ============================================================
    # NETTOYAGE COMPLET
    # ============================================================
    - name: Clean previous p4a builds
      run: |
        echo "========================================"
        echo "NETTOYAGE"
        echo "========================================"

        rm -rf "$HOME/.local/share/python-for-android"
        rm -rf "$HOME/.cache/python-for-android"
        rm -rf "$HOME/.cache/pip"

        rm -rf "$GITHUB_WORKSPACE/.buildozer"
        rm -rf "$GITHUB_WORKSPACE/build"
        rm -rf "$GITHUB_WORKSPACE/dist"
        rm -rf "$GITHUB_WORKSPACE/bin"

        source venv/bin/activate

        p4a clean_builds || true

    # ============================================================
    # VERIFICATION ENVIRONNEMENT
    # ============================================================
    - name: Verify environment
      run: |
        source venv/bin/activate

        echo "========================================"
        echo "PYTHON"
        echo "========================================"

        python --version
        which python

        echo "========================================"
        echo "P4A"
        echo "========================================"

        p4a --version
        which p4a

        echo "========================================"
        echo "CYTHON"
        echo "========================================"

        cython --version

        echo "========================================"
        echo "SH"
        echo "========================================"

        python -c "import sh; print('sh =', sh.__version__)"

        echo "========================================"
        echo "JAVA"
        echo "========================================"

        java -version

        echo "========================================"
        echo "SDK"
        echo "========================================"

        test -d "$SDK_DIR"
        echo "SDK OK"

        test -d "$SDK_DIR/platforms/android-35"
        echo "Android API 35 OK"

        echo "========================================"
        echo "NDK"
        echo "========================================"

        test -d "$ANDROID_NDK_HOME"
        echo "NDK OK"

        echo "========================================"
        echo "LLVM"
        echo "========================================"

        test -d \
          "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"

        echo "LLVM OK"

    # ============================================================
    # VERIFICATION ARCHITECTURE
    # ============================================================
    - name: Verify p4a architecture configuration
      run: |
        source venv/bin/activate

        echo "========================================"
        echo "ARCHITECTURES P4A"
        echo "========================================"

        p4a apk --help | grep -A2 -B2 -- "--arch" || true

        echo "Architecture utilisée : arm64-v8a"

    # ============================================================
    # BUILD APK
    # ============================================================
    - name: Build APK
      run: |
        source venv/bin/activate

        BUILD="${{ github.event.inputs.build_type }}"

        echo "========================================"
        echo "BUILD TYPE : $BUILD"
        echo "========================================"

        if [ "$BUILD" = "debug" ]; then

          echo "========================================"
          echo "BUILD DEBUG"
          echo "========================================"

          p4a apk \
            --private="$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon="$GITHUB_WORKSPACE/logo.png" \
            --presplash="$GITHUB_WORKSPACE/logo1.png" \
            --requirements=python3,kivy \
            --permission=INTERNET \
            --permission=ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=arm64-v8a \
            --sdk_dir="$SDK_DIR" \
            --ndk_dir="$ANDROID_NDK_HOME" \
            --android_api="$ANDROID_API" \
            --dist-name=monapp_debug \
            --debug

        elif [ "$BUILD" = "release" ]; then

          echo "========================================"
          echo "BUILD RELEASE"
          echo "========================================"

          p4a apk \
            --private="$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon="$GITHUB_WORKSPACE/logo.png" \
            --presplash="$GITHUB_WORKSPACE/logo1.png" \
            --requirements=python3,kivy \
            --permission=INTERNET \
            --permission=ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=arm64-v8a \
            --sdk_dir="$SDK_DIR" \
            --ndk_dir="$ANDROID_NDK_HOME" \
            --android_api="$ANDROID_API" \
            --dist-name=monapp_release \
            --release

        else

          echo "❌ Type de build inconnu : $BUILD"
          exit 1

        fi

    # ============================================================
    # RECHERCHE APK
    # ============================================================
    - name: Find APK
      run: |
        echo "========================================"
        echo "APK GENERES"
        echo "========================================"

        find "$GITHUB_WORKSPACE" \
          -type f \
          -name "*.apk" \
          -print

    # ============================================================
    # VERIFICATION APK
    # ============================================================
    - name: Verify APK exists
      run: |
        APK=$(find "$GITHUB_WORKSPACE" \
          -type f \
          -name "*.apk" | head -n 1)

        if [ -z "$APK" ]; then
          echo "❌ Aucun APK trouvé"
          exit 1
        fi

        echo "========================================"
        echo "APK TROUVE"
        echo "========================================"

        echo "$APK"
        ls -lh "$APK"

    # ============================================================
    # RENOMMAGE
    # ============================================================
    - name: Rename APK
      run: |
        APK=$(find "$GITHUB_WORKSPACE" \
          -type f \
          -name "*.apk" | head -n 1)

        BUILD="${{ github.event.inputs.build_type }}"

        if [ "$BUILD" = "debug" ]; then

          cp "$APK" \
            "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"

          echo "✅ APK DEBUG créé"

        else

          cp "$APK" \
            "$GITHUB_WORKSPACE/mon_budget_perso_release.apk"

          echo "✅ APK RELEASE créé"

        fi

        echo "========================================"
        echo "APK FINAL"
        echo "========================================"

        ls -lh "$GITHUB_WORKSPACE"/*.apk

    # ============================================================
    # UPLOAD
    # ============================================================
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: "*.apk"
        if-no-files-found: error
