name: Build originale + pub 5

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "sans_pub_debug"
        type: choice
        options:
          - sans_pub_debug
          - sans_pub_release
          - avec_pub_debug
          - avec_pub_release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python & python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Cleanup previous builds
      run: |
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/*

    - name: Build APK
      run: |
        source venv/bin/activate
        cd "$GITHUB_WORKSPACE"
        echo "=== TYPE DE BUILD : ${{ github.event.inputs.build_type }} ==="

        mkdir -p ~/.local/share/python-for-android/templates/

        # Inject the manifest template (with AdMob App ID test)
        cat > ~/.local/share/python-for-android/templates/AndroidManifest.tmpl.xml << 'EOF'
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
        package="org.example.monapp.pub">

        <uses-permission android:name="android.permission.INTERNET"/>
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
        <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>

        <application android:label="Mon budget perso (pub)" android:icon="@drawable/icon">
        <meta-data
            android:name="com.google.android.gms.ads.APPLICATION_ID"
            android:value="ca-app-pub-3940256099942544~3347511713"/>
        </application>

        </manifest>
        EOF

        #############################
        # SANS PUB - DEBUG
        #############################
        if [ "${{ github.event.inputs.build_type }}" = "sans_pub_debug" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --dist-name=monapp_debug \
            --debug
          cp $(find . -type f -name "*debug*.apk" | head -n 1) "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi

        #############################
        # SANS PUB - RELEASE
        #############################
        if [ "${{ github.event.inputs.build_type }}" = "sans_pub_release" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=arm64-v8a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --dist-name=monapp_release \
            --release
        fi

        #############################
        # AVEC PUB - DEBUG
        #############################
        if [ "${{ github.event.inputs.build_type }}" = "avec_pub_debug" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp.pub \
            --name="Mon budget perso (pub)" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,kivmob,android,pyjnius,play-services-ads \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --permission ACCESS_WIFI_STATE \
            --orientation=portrait \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --arch=armeabi-v7a \
            --dist-name=monapp_pub_debug \
            --debug \
            --copy-libs \
            --enable-androidx \
            
          cp $(find . -type f -name "*debug*.apk" | head -n 1) "$GITHUB_WORKSPACE/mon_budget_perso_pub_debug.apk"
        fi

        #############################
        # AVEC PUB - RELEASE
        #############################
        if [ "${{ github.event.inputs.build_type }}" = "avec_pub_release" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp.pub \
            --name="Mon budget perso (pub)" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,kivmob,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --permission ACCESS_WIFI_STATE \
            --orientation=portrait \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --arch=arm64-v8a \
            --dist-name=monapp_pub_release \
            --release \
            --copy-libs \
            --enable-androidx \
            --add-gradle-dependencies=com.google.android.gms:play-services-ads:22.6.0

          cp $(find . -type f -name "*release-unsigned*.apk" | head -n 1) "$GITHUB_WORKSPACE/mon_budget_perso_pub_release_unsigned.apk"
        fi

    ###############################################
    #   🔍 VÉRIFICATION APK
    ###############################################
    - name: Verify APK content
      run: |
        sudo apt-get install -y aapt unzip
        APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
        echo "APK détecté : $APK_FILE"

        echo "=== Classes Google Ads ==="
        unzip -l "$APK_FILE" | grep -E "gms|ads" || echo "⚠️ Aucune classe Google Ads trouvée"

        echo "=== Vérification Manifest : APPLICATION_ID ==="
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -i "APPLICATION_ID" || echo "⚠️ App ID AdMob manquant"

        echo "=== Vérification SDK Google Ads présent ==="
        if unzip -l "$APK_FILE" | grep -q "com/google/android/gms/ads"; then
          echo "✔️ Google Ads détecté"
        else
          echo "❌ Google Ads ABSENT"
          exit 1
        fi

    ###############################################
    # 📄 RAPPORT HTML
    ###############################################
    - name: Generate AdMob Diagnostics Report
      run: |
        sudo apt-get install -y aapt unzip
        APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
        REPORT="$GITHUB_WORKSPACE/report_admob.html"

        echo "<html><head><meta charset='UTF-8'><title>AdMob Diagnostics Report</title></head><body>" > "$REPORT"
        echo "<h1>📊 Rapport de diagnostic AdMob</h1>" >> "$REPORT"
        echo "<p><strong>APK :</strong> $APK_FILE</p>" >> "$REPORT"
        echo "<h2>Manifest</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml >> "$REPORT"
        echo "</pre>" >> "$REPORT"
        echo "<h2>Google Ads SDK</h2><pre>" >> "$REPORT"
        unzip -l "$APK_FILE" | grep -i "com/google/android/gms/ads" >> "$REPORT"
        echo "</pre></body></html>" >> "$REPORT"

    - name: Upload AdMob Report
      uses: actions/upload-artifact@v4
      with:
        name: rapport-admob
        path: ${{ github.workspace }}/report_admob.html

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ${{ github.workspace }}/*.apk
