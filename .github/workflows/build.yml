name: Build APK (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: ⚙️ Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git@develop

    - name: 📦 Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: 🧹 Clean previous builds
      run: |
        echo "🧹 Nettoyage complet..."
        rm -rf .buildozer dist build bin ~/.local/share/python-for-android ~/.gradle ~/.cache
        echo "✅ Environnement propre et prêt."

    - name: 🏗️ Build APK + Patch AdMob
      run: |
        source venv/bin/activate
        echo "🚀 Type de build : ${{ github.event.inputs.build_type }}"

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          DIST_NAME="monapp_release"
          ARCH="arm64-v8a"
          MODE="--release"
        else
          DIST_NAME="monapp_debug"
          ARCH="armeabi-v7a"
          MODE="--debug"
        fi

        echo "📦 Compilation avec python-for-android..."
        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --arch=$ARCH \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=36 \
          --orientation=portrait \
          --dist-name=$DIST_NAME \
          $MODE

        echo "🧩 Injection de la dépendance AdMob..."
        GRADLE_FILE="$HOME/.local/share/python-for-android/dists/$DIST_NAME/build.gradle"

        if [ -f "$GRADLE_FILE" ]; then
          echo "📄 Fichier trouvé : $GRADLE_FILE"
          # Ajout du dépôt Google
          if ! grep -q "google()" "$GRADLE_FILE"; then
            sed -i '/repositories {/a\    google()' "$GRADLE_FILE"
            echo "✅ Dépôt Google ajouté"
          fi
          # Ajout de la dépendance AdMob (syntaxe compile compatible)
          if ! grep -q "com.google.android.gms:play-services-ads" "$GRADLE_FILE"; then
            sed -i '/dependencies {/a\    compile "com.google.android.gms:play-services-ads:23.3.0"' "$GRADLE_FILE"
            echo "✅ Dépendance AdMob ajoutée avec compile"
          fi
        else
          echo "❌ Fichier build.gradle introuvable : $GRADLE_FILE"
          exit 1
        fi

        echo "🏗️ Reconstruction Gradle..."
        pushd "$HOME/.local/share/python-for-android/dists/$DIST_NAME"
        ./gradlew clean assembleRelease || ./gradlew clean assembleDebug || true
        popd

        APK_PATH=$(find "$HOME/.local/share/python-for-android/dists/$DIST_NAME" -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ Aucun APK trouvé après reconstruction !"
          find "$HOME/.local/share/python-for-android/dists/$DIST_NAME" -type f -name "*.apk"
          exit 1
        fi

        echo "✅ APK généré : $APK_PATH"
        cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_${{ github.event.inputs.build_type }}.apk"

    - name: 🔍 Vérification de la présence d'AdMob
      run: |
        echo "🔎 Vérification de la présence des classes Google Ads..."
        APK_FILE=$(find . -name "*.apk" | head -n 1)
        if unzip -l "$APK_FILE" | grep -q "com/google/android/gms/ads"; then
          echo "✅ AdMob détecté dans l'APK !"
        else
          echo "❌ AdMob non trouvé dans l'APK — la dépendance semble manquante !"
          exit 1
        fi

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./mon_budget_perso_${{ github.event.inputs.build_type }}.apk
