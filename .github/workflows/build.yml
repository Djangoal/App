name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: 🧰 Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip setuptools wheel
          pip install Cython==0.29.36
          pip install git+https://github.com/kivy/python-for-android.git@2024.05.01
          pip install kivy==2.3.0

      - name: 🧹 Clean old builds and patches
        run: |
          rm -rf ~/.local/share/python-for-android ~/.buildozer .buildozer build dist || true
          rm -f ~/.local/share/python-for-android/src/patches/SDLSurface.java.patch || true

      - name: 🔑 Setup Keystore
        run: |
          mkdir -p android/keystore
          echo "${{ secrets.KEYSTORE_FILE }}" | base64 --decode > android/keystore/my-release-key.keystore

      - name: ⚙️ Build release APK
        run: |
          source venv/bin/activate
          p4a apk \
            --private $GITHUB_WORKSPACE/app \
            --package=org.example.monbudgetperso \
            --name="Mon Budget Perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=app/logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --depend com.google.android.gms:play-services-ads:23.3.0 \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=arm64-v8a \
            --sdk-dir=$ANDROID_SDK_ROOT \
            --ndk-dir=$ANDROID_NDK_HOME \
            --android-api=36 \
            --orientation=portrait \
            --release \
            --keystore android/keystore/my-release-key.keystore \
            --signkey "${{ secrets.KEY_ALIAS }}" \
            --keystorepw "${{ secrets.KEYSTORE_PASSWORD }}" \
            --force-build

      - name: 📤 Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonBudgetPerso-APK
          path: dist/*.apk
