name: Build APK incluant aar 3(unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python & python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp || true
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest || true

        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Cleanup previous builds
      run: |
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/monapp_release || true
        rm -rf ~/.local/share/python-for-android/dists/monapp_debug || true

    # --- IMPORTANT: ensure your .aar are in app/libs/ in the repo ---
    - name: Debug: list local AARs
      run: |
        echo ">>> AAR locaux dans app/libs:"
        ls -la app/libs || true
        echo ">>> fichiers .aar:"
        ls -la app/libs/*.aar || echo "Aucun .aar trouvé dans app/libs/"

    - name: Build APK (include AAR as local java modules)
      run: |
        source venv/bin/activate
        cd "$GITHUB_WORKSPACE"

        # Verify local aar files exist
        echo "=== Vérification des .aar locaux ==="
        ls -la app/libs/*.aar || { echo "❌ Les fichiers .aar sont introuvables dans app/libs/"; exit 1; }

        # extract classes.jar into jars to use --add-jar if you want
        echo "=== Extraction classes.jar des AAR (optionnel) ==="
        mkdir -p app/libs/jars
        for aar in app/libs/*.aar; do
          echo "-> extraction classes.jar from $aar"
          unzip -qo "$aar" classes.jar -d app/libs/jars/ || true
        done

        ADD_JARS=""
        for jar in app/libs/jars/*.jar; do
          # ensure full path
          ADD_JARS="$ADD_JARS --add-jar=$GITHUB_WORKSPACE/$jar"
        done

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          MODE="--release"
          DIST_NAME="monapp_release"
        else
          MODE="--debug"
          DIST_NAME="monapp_debug"
        fi

        echo "=== Lancement p4a avec --local-java-modules pour inclure les AAR ==="
        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android,pyjnius \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --arch=arm64-v8a \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=35 \
          --orientation=portrait \
          --dist-name=${DIST_NAME} \
          $MODE \
          --local-java-modules="$GITHUB_WORKSPACE/app/libs/*.aar" \
          $ADD_JARS \
          --meta-data=com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713

        echo "=== Recherche de l'APK généré ==="
        # prefer the copied FINAL_APK name to be deterministic
        APK_PATH=$(find . -type f -name "*${DIST_NAME}*.apk" -o -name "*${{ github.event.inputs.build_type }}*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ Aucun APK trouvé après build !"
          find . -maxdepth 6 -type f -name "*.apk" || true
          exit 1
        fi
        echo "✅ APK trouvé : $APK_PATH"

        # copy to workspace with deterministic name
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
        else
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi
        cp "$APK_PATH" "$FINAL_APK"
        echo "Final APK copied to $FINAL_APK"

        # export path for next steps
        echo "APK_PATH=$FINAL_APK" >> $GITHUB_ENV

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ${{ env.APK_PATH }}

    - name: Debug: list APKs and APK content top
      run: |
        echo ">>> APK path used: ${{ env.APK_PATH }}"
        if [ ! -f "${{ env.APK_PATH }}" ]; then
          echo "❌ APK final introuvable: ${{ env.APK_PATH }}" && exit 1
        fi
        echo ">>> fichiers APK generes (pwd):"
        find . -type f -name "*.apk" -maxdepth 6 -print || true
        TMP=$(mktemp -d)
        unzip -q "${{ env.APK_PATH }}" -d "$TMP"
        echo ">>> top-level files inside APK:"
        find "$TMP" -maxdepth 2 -type f | sed -n '1,200p'

    - name: List AAR files in APK (if any packed as files)
      run: |
        echo "=== Listing .aar files INSIDE the APK (raw .aar stored) ==="
        TMP=$(mktemp -d)
        unzip -q "${{ env.APK_PATH }}" -d "$TMP"
        # list any .aar stored verbatim
        find "$TMP" -type f -name "*.aar" -print || echo "⚠️ Aucun .aar trouvé stocké tel quel dans l'APK."

    - name: Verify AdMob presence (search for classes)
      run: |
        echo "=== Vérification presence classes AdMob dans l'APK (com/google/android/gms/ads) ==="
        TMP=$(mktemp -d)
        unzip -q "${{ env.APK_PATH }}" -d "$TMP"
        if grep -qr "com/google/android/gms/ads" "$TMP"; then
          echo "✅ Classes AdMob trouvées dans l'APK."
        else
          echo "⚠️ Classes AdMob NON trouvées dans l'APK. L'AdMob SDK pourrait ne pas avoir été inclus correctement."
          # print a hint of libs folder and manifest for debugging
          echo ">>> Contenu du dossier res/ et lib/ (s'il existe) :"
          find "$TMP" -maxdepth 3 -type d -name "lib" -o -name "res" -print || true
          exit 1
        fi
