name: Build APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /home/runner/android-sdk
      ANDROID_HOME: /home/runner/android-sdk
      PATH: /home/runner/.local/bin:/home/runner/android-sdk/cmdline-tools/latest/bin:/home/runner/android-sdk/platform-tools:$PATH

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    
    - name: Install system dependencies
      run: |
       sudo apt-get update
       sudo apt-get install -y \
       zip unzip tar findutils openjdk-17-jdk python3-pip \
       git build-essential libncurses-dev libffi-dev \
       libssl-dev libsqlite3-dev libjpeg-dev \
       zlib1g-dev libpng-dev
      
    - name: Set up Android SDK
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT/cmdline-tools
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
        unzip tools.zip
        mv cmdline-tools latest
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager "platform-tools" "platforms;android-36" "build-tools;34.0.0"

    - name: Install Buildozer and dependencies
      run: |
        python3 -m pip install --upgrade pip
        pip install buildozer cython

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Show buildozer log if failed
      if: failure()
      run: |
        echo "======= BUILD ERROR LOG ======="
        find . -name "build.log"
        cat .buildozer/android/platform/build-armeabi-v7a/build/build.log || echo "No build.log file found"

    - name: Rename APK
      run: |
        APK_FILE=$(find bin/ -name "*.apk" | head -n 1)
        mv "$APK_FILE" "mon_budget_perso.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-apk
        path: ./mon_budget_perso.apk
