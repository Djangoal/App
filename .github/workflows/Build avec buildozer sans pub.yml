name: 1 build avec buildozer sans pub

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: ${{ github.workspace }}/cmdline-tools
      ANDROID_SDK_ROOT: ${{ github.workspace }}/cmdline-tools
      PATH: ${{ github.workspace }}/cmdline-tools/bin:$PATH

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          python3-pip \
          python3-setuptools \
          python3-virtualenv \
          git \
          zip \
          unzip \
          openjdk-17-jdk

    - name: Install Buildozer
      run: |
        python3 -m pip install --upgrade pip cython wheel
        python3 -m pip install buildozer

    - name: Accept licenses and install required SDK packages
      run: |
        yes | $ANDROID_HOME/bin/sdkmanager --licenses
        $ANDROID_HOME/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;25.2.9519653"

    - name: Clean previous build
      run: |
        rm -rf .buildozer
        rm -rf bin

    - name: Build APK
      run: |
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "=== BUILD RELEASE ==="
          buildozer android release
        else
          echo "=== BUILD DEBUG ==="
          buildozer android debug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: bin/*.apk
