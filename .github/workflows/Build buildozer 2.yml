name: Build APK avec Buildozer + AdMob (Docker)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: kivy/buildozer:latest  # Image officielle Buildozer avec SDK/NDK

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Cleanup previous builds
        run: rm -rf .buildozer bin build dist

      - name: Install Python dependencies (optionnel)
        run: |
          pip install --upgrade pip
          pip install cython

      - name: Build APK
        run: |
          export ANDROIDAPI=33
          export ANDROIDMINAPI=21
          echo "=== Build type: ${{ github.event.inputs.build_type }} ==="

          # Build et capture complète du log
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            buildozer -v android release > build.log 2>&1 || (tail -n 1000 build.log && exit 1)
          else
            buildozer -v android debug > build.log 2>&1 || (tail -n 1000 build.log && exit 1)
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-budget-${{ github.event.inputs.build_type }}
          path: bin/*.apk

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.build_type }}
          path: build.log
