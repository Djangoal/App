name: Build APK (unsigned)
 
on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653
 
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
 
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4
 
    - name: Setup Python, virtualenv and install python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git
 
    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"
 
    - name: Cleanup previous builds
      run: |
        echo "Cleaning old builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/monapp_release
        rm -rf ~/.local/share/python-for-android/dists/monapp_debug
        echo "Environment ready"
 
    - name: Build APK
      run: |
        source venv/bin/activate
        echo "Build type: ${{ github.event.inputs.build_type }}"
 
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
          BUILD_TYPE="--release"
          DIST_NAME="monapp_release"
          ARCH="arm64-v8a"
        else
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
          BUILD_TYPE="--debug"
          DIST_NAME="monapp_debug"
          ARCH="armeabi-v7a"
        fi
 
        echo "=== Building APK with AdMob ==="
        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --arch=$ARCH \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=35 \
          --orientation=portrait \
          --dist-name=$DIST_NAME \
          $BUILD_TYPE \
          --add-jar=app/libs/play-services-basement-18.5.0.aar \
          --add-jar=app/libs/play-services-tasks-18.3.2.aar \
          --add-jar=app/libs/play-services-ads-24.3.0.aar \
          --meta-data=com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713
        APK_PATH=$(find . -type f -name "*.apk" | head -n 1)

        if [ -z "$APK_PATH" ]; then
          echo "❌ Aucun APK trouvé !"
          find . -type f -name "*.apk"
          exit 1
        fi

        echo "✅ APK trouvé : $APK_PATH"
        cp "$APK_PATH" "$FINAL_APK"
 
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          $SDK_DIR/build-tools/35.0.0/zipalign -v 4 "$FINAL_APK" "${FINAL_APK%.apk}-aligned.apk"
          FINAL_APK="${FINAL_APK%.apk}-aligned.apk"
          echo "✅ APK aligné : $FINAL_APK"
        fi
 
    - name: Verify AdMob presence
      run: |
       echo "Vérification de la présence de AdMob dans l'APK..."
   
       # Utiliser directement APK_PATH trouvé précédemment
       if [ -z "$APK_PATH" ]; then
       echo "❌ Aucun APK trouvé pour la vérification !"
        exit 1
       fi

       TMP_DIR=$(mktemp -d)
       unzip -q "$APK_PATH" -d "$TMP_DIR"

       if grep -qr "com/google/android/gms/ads" "$TMP_DIR"; then
        echo "✅ AdMob SDK trouvé dans l'APK."
       else
        echo "❌ AdMob SDK NON trouvé !"
        exit 1
       fi
 
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk
