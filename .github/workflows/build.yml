name: Build APK (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v3

    - name: ⚙️ Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential zip unzip openjdk-17-jdk python3-pip libtool libltdl-dev automake autoconf pkg-config m4 libncurses-dev
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git@develop

    - name: 📦 Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: 🧹 Cleanup
      run: rm -rf .buildozer dist build bin ~/.local/share/python-for-android ~/.gradle ~/.cache

    - name: 🧩 Donner les droits à la recette custom
      run: chmod +x app/recipes/google_play_services_ads/recipe.sh || true

    - name: 🏗️ Build APK
      run: |
        source venv/bin/activate
        BUILD_TYPE=${{ github.event.inputs.build_type }}
        DIST_NAME="monapp_${BUILD_TYPE}"

        echo "🚀 Building $BUILD_TYPE APK..."
        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --arch=arm64-v8a \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=36 \
          --orientation=portrait \
          --dist-name=$DIST_NAME \
          $( [ "$BUILD_TYPE" = "release" ] && echo "--release" || echo "--debug" )

    - name: 🔧 Inject AdMob Gradle dependency
      run: |
        echo "🔧 Injection de la dépendance AdMob dans build.gradle..."
        GRADLE_FILE=$(find ~/.local/share/python-for-android/dists/ -name "build.gradle" | head -n 1)
        if [ -z "$GRADLE_FILE" ]; then
          echo "❌ build.gradle introuvable !"
          exit 1
        fi

        echo "📄 Fichier trouvé : $GRADLE_FILE"

        # Ajout du dépôt Google
        sed -i '/repositories {/a\        google()' "$GRADLE_FILE"

        # Ajout de la dépendance AdMob
        sed -i '/dependencies {/a\    compile "com.google.android.gms:play-services-ads:23.3.0"' "$GRADLE_FILE"

        echo "✅ Dépendance AdMob ajoutée"

    - name: 🧱 Rebuild Gradle
      run: |
        GRADLE_DIR=$(dirname $(find ~/.local/share/python-for-android/dists/ -name "gradlew" | head -n 1))
        if [ -z "$GRADLE_DIR" ]; then
          echo "❌ gradlew introuvable !"
          exit 1
        fi
        echo "🏗️ Reconstruction du projet Gradle dans $GRADLE_DIR"
        cd "$GRADLE_DIR"
        ./gradlew clean assembleRelease || ./gradlew clean assembleDebug

    - name: 🔍 Vérification AdMob
      run: |
        APK_FILE=$(find . -name "*.apk" | head -n 1)
        echo "🔎 Vérification de la présence d'AdMob dans : $APK_FILE"
        unzip -l "$APK_FILE" | grep -q "com/google/android/gms/ads" \
          && echo "✅ AdMob détecté dans l'APK" \
          || (echo "❌ AdMob non trouvé !" && exit 1)

    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./*.apk
