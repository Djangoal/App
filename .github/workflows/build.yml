name: Build APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/.buildozer/android/platform/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/.buildozer/android/platform/android-ndk-r25b

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
        zip unzip openjdk-17-jdk python3-pip \
        git build-essential libncurses-dev libffi-dev \
        libssl-dev libsqlite3-dev libjpeg-dev \
        zlib1g-dev libpng-dev

    - name: Install Cython
      run: |
        pip install cython
        
    - name: Setup Python & install buildozer
      run: |
        python3 -m pip install --upgrade pip
        pip install buildozer

    - name: Build APK with Buildozer
      run: |
        cd ${{ github.workspace }}
        buildozer android debug

    

    - name: Rename APK
      run: |
        APK_FILE=$(find bin/ -name "*.apk" | head -n 1)
        mv "$APK_FILE" "mon_budget_perso.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-apk
        path: ./mon_budget_perso.apk
