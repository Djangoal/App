name: Build avec vérification 1

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: 🧩 Checkout repo
      uses: actions/checkout@v4

    - name: ▶️ Display selected build type
      run: |
       echo "Selected build type: ${{ github.event.inputs.build_type }}"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: 🔧 Install Buildozer + Kivy
      run: |
        python -m pip install --upgrade pip setuptools cython==0.29.33 wheel
        pip install buildozer
        pip install kivy

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"
          
    - name: Cleanup previous builds
      run: |
        echo "Cleaning old builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/monapp_release
        rm -rf ~/.local/share/python-for-android/dists/monapp_debug


    - name: 📦 Install apktool (conservé pour usage futur)
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool

    - name: 🔧 Configure Android env
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/Android" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/cmdline-tools/latest/bin:$HOME/Android/platform-tools:$HOME/Android/build-tools/33.0.2:$PATH" >> $GITHUB_ENV

    - name: 🏗️ Build APK with Buildozer
      run: |
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "Building RELEASE..."
          buildozer --verbose android release
        else
          echo "Building DEBUG..."
          buildozer --verbose android debug
        fi

    - name: 🔍 List build outputs
      run: |
        echo "📁 Contenu du dossier bin :"
        ls -lh ./bin

    - name: 📤 Upload APK / AAB
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./bin/*${{ github.event.inputs.build_type }}*.apk
          ./bin/*${{ github.event.inputs.build_type }}*.aab
          ./bin/*unsigned*.apk
