name: Build APK with Buildozer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use official Kivy Docker image
      run: |
        docker run --rm -v ${{ github.workspace }}:/app \
        -w /app kivy/buildozer \
        buildozer android debug    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-apk
        path: ./mon_budget_perso.apk
