name: Build and Sign APK with python-for-android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential zip unzip openjdk-17-jdk python3-pip \
          libtool libtool-bin automake autoconf pkg-config m4 \
          libncurses-dev
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: 🧹 Préparation avant build
      run: |
        echo "🧹 Nettoyage complet des anciens builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/*
        echo "✅ Environnement prêt."

    - name: Build APK
      run: |
        source venv/bin/activate
        echo "🚀 Type de build : ${{ github.event.inputs.build_type }}"

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=arm64-v8a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp_release \
            --release
        else
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp_debug \
            --debug
        fi

    - name: ✅ Signature APK (release uniquement)
      if: ${{ github.event.inputs.build_type == 'release' }}
      run: |
        echo "🔒 Signature du fichier APK..."
        APK_FILE=$(find . -name "*.apk" | head -n 1)
        mkdir -p android/keystore
        cp android/keystore/my-release-key.keystore my-release-key.keystore
        # Signature avec apksigner
        $SDK_DIR/build-tools/36.0.0/apksigner sign \
          --ks my-release-key.keystore \
          --ks-key-alias monalias \
          --ks-pass pass:19051987 \
          --key-pass pass:19051987 \
          "$APK_FILE"
        echo "📜 Vérification de la signature..."
        $SDK_DIR/build-tools/36.0.0/apksigner verify --verbose "$APK_FILE"
        mv "$APK_FILE" "mon_budget_perso_release.apk"

    - name: Rename APK (debug)
      if: ${{ github.event.inputs.build_type == 'debug' }}
      run: |
        APK_FILE=$(find . -name "*.apk" | head -n 1)
        mv "$APK_FILE" "mon_budget_perso_debug.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./mon_budget_perso_${{ github.event.inputs.build_type }}.apk
