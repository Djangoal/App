name: 📱 Build Android App (Kivy)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout du code
        uses: actions/checkout@v4

      - name: 🧰 Installation des dépendances système
        run: |
          sudo apt update
          sudo apt install -y python3-pip openjdk-17-jdk zip unzip wget git

      - name: 🐍 Installation de Buildozer et Kivy
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: 🧩 Préparation du projet Android (icône)
        run: |
          mkdir -p android/app/src/main/res/mipmap-xxxhdpi
          if [ -f "app/logo.png" ]; then
            cp app/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
            echo "✅ Icône locale copiée depuis app/logo.png"
          else
            echo "⚠️ Aucun logo trouvé dans app/logo.png — création d'un placeholder"
            mkdir -p app
            touch app/logo.png
            cp app/logo.png android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          fi

      - name: ⚙️ Compilation APK avec Buildozer (debug/release)
        run: |
          BUILD_TYPE="${{ github.event.inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="debug"
          fi
          echo "🛠️ Build type: $BUILD_TYPE"
          if [ "$BUILD_TYPE" = "release" ]; then
            buildozer android release || { echo "❌ buildozer release failed"; exit 1; }
          else
            buildozer android debug || { echo "❌ buildozer debug failed"; exit 1; }
          fi

      - name: 📱 Chercher l’APK généré
        id: find_apk
        run: |
          # buildozer places apks in bin/ by default; try common locations
          echo "🔍 Recherche d'APK..."
          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK trouvé — listing des dossiers bin/ et ."
            find bin -maxdepth 2 -type f -name "*.apk" || true
            find . -maxdepth 4 -type f -name "*.apk" || true
            exit 1
          fi
          echo "✅ APK trouvé : $APK_PATH"
          echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

      - name: 🔍 Vérification des services Google et AdMob
        run: |
          echo "🔍 Vérification de l’intégration de Google Play Services et AdMob..."
          sudo apt update
          sudo apt install -y apktool >/dev/null
          
          APK_FILE="${{ steps.find_apk.outputs.apk_path }}"
          echo "📦 Analyse de $APK_FILE"
          
          rm -rf tmp_apk || true
          mkdir -p tmp_apk
          apktool d -f "$APK_FILE" -o tmp_apk >/dev/null || { echo "❌ apktool failed"; exit 1; }

          echo "📄 Recherche des dépendances dans le manifest..."
          MANIFEST="tmp_apk/AndroidManifest.xml"

          REPORT_FILE="rapport_google_services.json"
          echo "{" > $REPORT_FILE

          if grep -q "com.google.android.gms.ads" "$MANIFEST"; then
            echo "✅ AdMob détecté dans le manifest"
            echo '  "AdMob": true,' >> $REPORT_FILE
          else
            echo "⚠️ AdMob NON détecté"
            echo '  "AdMob": false,' >> $REPORT_FILE
          fi

          if grep -q "com.google.android.gms" "$MANIFEST"; then
            echo "✅ Google Play Services détecté"
            echo '  "GooglePlayServices": true,' >> $REPORT_FILE
          else
            echo "⚠️ Google Play Services NON détecté"
            echo '  "GooglePlayServices": false,' >> $REPORT_FILE
          fi

          if grep -q "com.google.firebase.analytics" "$MANIFEST"; then
            echo "✅ Firebase Analytics détecté"
            echo '  "FirebaseAnalytics": true' >> $REPORT_FILE
          else
            echo "⚠️ Firebase Analytics NON détecté"
            echo '  "FirebaseAnalytics": false' >> $REPORT_FILE
          fi

          echo "}" >> $REPORT_FILE

          echo "🔎 Vérification des classes DEX et assets..."
          unzip -l "$APK_FILE" | grep -E "com/google/android/gms|firebase|ads" || echo "⚠️ Aucune classe Google/AdMob trouvée dans l’APK"

          echo "🧾 Rapport généré : $REPORT_FILE"
          cat $REPORT_FILE

      - name: 💾 Sauvegarde de l’APK et du rapport
        uses: actions/upload-artifact@v4
        with:
          name: app-${{ github.event.inputs.build_type }}
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            rapport_google_services.json
