apply plugin: 'com.android.application'

android {
    compileSdkVersion = 36
    defaultConfig {
        minSdkVersion 24
        targetSdkVersion 36
    }
    sourceSets {
        main {
            java.srcDirs = ['src']
            manifest.srcFile 'AndroidManifest.xml'
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}

repositories {
    google()
    mavenCentral()
}

dependencies {
    implementation 'com.google.android.gms:play-services-ads:23.3.0'
}
