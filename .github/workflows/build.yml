name: Build & Sign APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python, virtualenv and install python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: Cleanup previous builds
      run: |
        echo "Cleaning old builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/monapp_release
        rm -rf ~/.local/share/python-for-android/dists/monapp_debug
        echo "Environment ready"

    # Debug: Vérifier la longueur du secret
    - name: Debug KEYSTORE_BASE64 length
      if: ${{ github.event.inputs.build_type == 'release' }}
      run: |
        echo "KEYSTORE_BASE64 length: ${#KEYSTORE_BASE64}"
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

    # Restaurer le keystore et vérifier sa validité
    - name: Restore and Verify Keystore
      if: ${{ github.event.inputs.build_type == 'release' }}
      run: |
        mkdir -p android/keystore
        echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/my-release-key.keystore

        # Vérifier que le fichier a une taille > 0
        FILESIZE=$(stat -c%s "android/keystore/my-release-key.keystore")
        if [ "$FILESIZE" -eq 0 ]; then
          echo "ERROR: Keystore is empty. Check KEYSTORE_BASE64 secret."
          exit 1
        fi

        echo "Keystore restored. File info:"
        ls -lh android/keystore/my-release-key.keystore

        # Vérification du keystore avec keytool
        keytool -list -v \
          -keystore android/keystore/my-release-key.keystore \
          -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
          || { echo "ERROR: Keystore could not be read. Check Base64 or passwords."; exit 1; }

        # Vérification SHA256 du keystore
        echo "SHA256 of restored keystore:"
        sha256sum android/keystore/my-release-key.keystore

    - name: Build APK
      run: |
        source venv/bin/activate
        echo "Build type: ${{ github.event.inputs.build_type }}"

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          # Build release non signé
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=arm64-v8a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp_release \
            --release

          # Signer APK avec apksigner
          APK_PATH=$(find . -name "*-release-unsigned.apk" | head -n 1)
          echo "Signing APK: $APK_PATH"
          $SDK_DIR/build-tools/36.0.0/apksigner sign \
            --ks android/keystore/my-release-key.keystore \
            --ks-pass pass:"${{ secrets.KEYSTORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.KEY_PASSWORD }}" \
            --ks-key-alias "${{ secrets.KEY_ALIAS }}" \
            "$APK_PATH"

          # Vérifier la signature
          $SDK_DIR/build-tools/36.0.0/apksigner verify "$APK_PATH"
          echo "APK successfully signed!"

          # Vérifier SHA256 de l'APK signé
          echo "SHA256 of signed APK:"
          sha256sum "$APK_PATH"

          # Renommer APK signé
          mv "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_release.apk"

          # Nettoyer le keystore pour plus de sécurité
          rm -f android/keystore/my-release-key.keystore

        else
          # Build APK debug
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp_debug \
            --debug

          APK_PATH=$(find . -name "*-debug.apk" | head -n 1)
          mv "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./mon_budget_perso_${{ github.event.inputs.build_type }}.apk
