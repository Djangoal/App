name: Build APK (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          zip unzip \
          openjdk-17-jdk \
          python3-pip \
          libncurses6 \
          libncurses-dev \
          libstdc++6 \
          libffi-dev \
          libssl-dev \
          liblzma-dev \
          ccache \
          git

    - name: Setup Python and Buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install cython
        pip install buildozer
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest

        echo "Installing Android SDK packages..."
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: Accept Android licenses (again)
      run: |
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses

    - name: Set environment variables for Buildozer
      run: |
        echo "ANDROIDSDK=$SDK_DIR" >> $GITHUB_ENV
        echo "ANDROIDNDK=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "ANDROIDAPI=36" >> $GITHUB_ENV
        echo "ANDROIDMINAPI=21" >> $GITHUB_ENV

    - name: Cleanup previous builds
      run: |
        rm -rf .buildozer bin

    - name: Build APK with Buildozer
      run: |
        source venv/bin/activate
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "=== Building unsigned release APK ==="
          buildozer android release
          APK_PATH=$(find bin -type f -name "*release-unsigned.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
        else
          echo "=== Building debug APK ==="
          buildozer android debug
          APK_PATH=$(find bin -type f -name "*debug.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk
