name: Build APK with python-for-android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libltdl-dev \
          zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python & install python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: Clean previous builds
      run: |
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/*

    - name: Restore keystore (if secrets exist)
      if: ${{ github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' }}
      run: |
        mkdir -p android/keystore
        echo "$KEYSTORE_BASE64" | base64 --decode > android/keystore/my-release-key.keystore
        echo "✅ Keystore restauré avec succès"

    - name: Build APK
      run: |
        source venv/bin/activate
        echo "🚀 Type de build : ${{ github.event.inputs.build_type }}"

        BASE_ARGS="--private \"$GITHUB_WORKSPACE/app\" \
          --package=org.example.monapp \
          --name='Mon budget perso' \
          --version=0.1 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=36 \
          --orientation=portrait"

        if [ "${{ github.event.inputs.build_type }}" = "release" ] && [ -f "android/keystore/my-release-key.keystore" ]; then
          echo "🔒 Compilation en mode RELEASE signée..."
          ./venv/bin/p4a apk $BASE_ARGS \
            --arch=arm64-v8a \
            --dist-name=monapp_release \
            --keystore=$GITHUB_WORKSPACE/android/keystore/my-release-key.keystore \
            --signkey="${{ secrets.KEY_ALIAS }}" \
            --keystorepw="${{ secrets.KEYSTORE_PASSWORD }}" \
            --release
        elif [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "⚠️ Aucun keystore détecté — build RELEASE non signé."
          ./venv/bin/p4a apk $BASE_ARGS \
            --arch=arm64-v8a \
            --dist-name=monapp_unsigned \
            --release
        else
          echo "🐞 Compilation en mode DEBUG..."
          ./venv/bin/p4a apk $BASE_ARGS \
            --arch=armeabi-v7a \
            --dist-name=monapp_debug \
            --debug
        fi

    - name: Rename APK
      run: |
        APK_FILE=$(find . -name "*.apk" | head -n 1)
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          mv "$APK_FILE" "mon_budget_perso_release.apk"
        else
          mv "$APK_FILE" "mon_budget_perso_debug.apk"
        fi

    - name: Check APK contents
      run: |
        echo "🧩 Vérification du contenu META-INF..."
        unzip -l mon_budget_perso_${{ github.event.inputs.build_type }}.apk | grep META-INF || echo "❌ META-INF non trouvé (non signé)."

    - name: Verify signed APK
      if: ${{ github.event.inputs.build_type == 'release' && secrets.KEYSTORE_BASE64 != '' }}
      run: |
        sudo apt-get install -y apksigner zipalign
        echo "🔍 Vérification de la signature APK..."
        apksigner verify --verbose mon_budget_perso_release.apk || echo "⚠️ APK non signé correctement."

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./mon_budget_perso_${{ github.event.inputs.build_type }}.apk
