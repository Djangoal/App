name: 01 Build APK 2026

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:

    # ============================================================
    # CHECKOUT
    # ============================================================
    - name: Checkout code
      uses: actions/checkout@v4

    # ============================================================
    # PYTHON 3.11
    # ============================================================
    - name: Setup Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    # ============================================================
    # JAVA 17
    # ============================================================
    - name: Setup Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    # ============================================================
    # DEPENDANCES SYSTEME
    # ============================================================
    - name: Install system dependencies
      run: |
        sudo apt-get update

        sudo apt-get install -y \
          build-essential \
          libltdl-dev \
          zip \
          unzip \
          libncurses-dev \
          libtool \
          libtool-bin \
          automake \
          autoconf \
          pkg-config \
          m4 \
          curl

    # ============================================================
    # VERIFICATION JAVA
    # ============================================================
    - name: Verify Java
      run: |
        echo "========================================"
        echo "JAVA"
        echo "========================================"

        java -version

        echo "JAVA_HOME=$JAVA_HOME"

        echo "========================================"
        echo "JAVAC"
        echo "========================================"

        javac -version

    # ============================================================
    # INSTALLATION PYTHON-FOR-ANDROID
    # ============================================================
    - name: Setup virtualenv and python-for-android
      run: |
        python -m venv venv

        source venv/bin/activate

        python -m pip install --upgrade pip setuptools wheel

        pip install "cython<3"

        pip install python-for-android

        echo "========================================"
        echo "PYTHON"
        echo "========================================"

        python --version

        echo "========================================"
        echo "P4A"
        echo "========================================"

        p4a --version

    # ============================================================
    # ANDROID SDK + NDK
    # ============================================================
    - name: Download Android SDK and NDK
      run: |
        mkdir -p "$SDK_DIR"

        curl -L \
          https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
          -o cmdline-tools.zip

        unzip -q cmdline-tools.zip -d "$SDK_DIR"

        mv "$SDK_DIR/cmdline-tools" "$SDK_DIR/cmdline-tools-temp"

        mkdir -p "$SDK_DIR/cmdline-tools/latest"

        mv "$SDK_DIR/cmdline-tools-temp"/* \
          "$SDK_DIR/cmdline-tools/latest/"

        export PATH="$SDK_DIR/cmdline-tools/latest/bin:$PATH"

        echo "========================================"
        echo "SDKMANAGER"
        echo "========================================"

        sdkmanager --version

        echo "========================================"
        echo "ANDROID LICENSES"
        echo "========================================"

        yes | sdkmanager \
          --sdk_root="$SDK_DIR" \
          --licenses || true

        echo "========================================"
        echo "INSTALLATION ANDROID"
        echo "========================================"

        sdkmanager \
          --sdk_root="$SDK_DIR" \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    # ============================================================
    # VARIABLES ANDROID
    # ============================================================
    - name: Configure Android environment
      run: |
        echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
        echo "ANDROID_NDK_ROOT=$ANDROID_NDK_HOME" >> "$GITHUB_ENV"

        echo "$SDK_DIR/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
        echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"

        echo "========================================"
        echo "ANDROID SDK"
        echo "========================================"

        echo "$SDK_DIR"

        echo "========================================"
        echo "ANDROID NDK"
        echo "========================================"

        echo "$ANDROID_NDK_HOME"

    # ============================================================
    # NETTOYAGE
    # ============================================================
    - name: Clean previous builds
      run: |
        rm -rf .buildozer
        rm -rf build
        rm -rf dist
        rm -rf bin

        source venv/bin/activate

        p4a clean_builds || true

    # ============================================================
    # VERIFICATION ENVIRONNEMENT
    # ============================================================
    - name: Verify build environment
      run: |
        source venv/bin/activate

        echo "========================================"
        echo "PYTHON"
        echo "========================================"

        python --version

        echo "========================================"
        echo "JAVA"
        echo "========================================"

        java -version

        echo "========================================"
        echo "P4A"
        echo "========================================"

        p4a --version

        echo "========================================"
        echo "ANDROID SDK"
        echo "========================================"

        ls "$SDK_DIR"

        echo "========================================"
        echo "ANDROID NDK"
        echo "========================================"

        ls "$ANDROID_NDK_HOME"

        echo "========================================"
        echo "LLVM"
        echo "========================================"

        ls "$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin" | head

    # ============================================================
    # BUILD APK
    # ============================================================
    - name: Build APK
      run: |
        source venv/bin/activate

        BUILD="${{ github.event.inputs.build_type }}"

        echo "========================================"
        echo "TYPE DE BUILD : $BUILD"
        echo "========================================"

        if [ "$BUILD" = "debug" ]; then

          echo "========================================"
          echo "BUILD DEBUG"
          echo "========================================"

          p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon="$GITHUB_WORKSPACE/logo.png" \
            --presplash="$GITHUB_WORKSPACE/logo1.png" \
            --requirements=python3,kivy,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=arm64-v8a \
            --sdk_dir="$SDK_DIR" \
            --ndk_dir="$ANDROID_NDK_HOME" \
            --android_api=35 \
            --dist-name=monapp_debug \
            --debug

        elif [ "$BUILD" = "release" ]; then

          echo "========================================"
          echo "BUILD RELEASE"
          echo "========================================"

          p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon="$GITHUB_WORKSPACE/logo.png" \
            --presplash="$GITHUB_WORKSPACE/logo1.png" \
            --requirements=python3,kivy,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=arm64-v8a \
            --sdk_dir="$SDK_DIR" \
            --ndk_dir="$ANDROID_NDK_HOME" \
            --android_api=35 \
            --dist-name=monapp_release \
            --release

        else

          echo "❌ Type de build inconnu : $BUILD"
          exit 1

        fi

    # ============================================================
    # RECHERCHE APK
    # ============================================================
    - name: Find APK
      run: |
        echo "========================================"
        echo "APK GENERES"
        echo "========================================"

        find . -type f -name "*.apk" -print

    # ============================================================
    # RENOMMAGE APK
    # ============================================================
    - name: Rename APK
      run: |
        APK=$(find . -type f -name "*.apk" | head -n 1)

        if [ -z "$APK" ]; then
          echo "❌ Aucun APK trouvé"
          exit 1
        fi

        BUILD="${{ github.event.inputs.build_type }}"

        if [ "$BUILD" = "debug" ]; then

          cp "$APK" mon_budget_perso_debug.apk

          echo "✅ APK DEBUG créé"

        else

          cp "$APK" mon_budget_perso_release.apk

          echo "✅ APK RELEASE créé"

        fi

        echo "========================================"
        echo "APK FINAL"
        echo "========================================"

        ls -lh *.apk

    # ============================================================
    # UPLOAD APK
    # ============================================================
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: "*.apk"
        if-no-files-found: error
