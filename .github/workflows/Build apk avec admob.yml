name: Build APK avec AdMob

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:

    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Install python-for-android (stable)
      run: |
        python3 -m pip install --upgrade pip cython
        pip install "python-for-android==2024.06.09"

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Clean previous builds
      run: |
        rm -rf ~/.local/share/python-for-android/dists/*
        rm -rf build/ dist/ .buildozer/

    - name: Build APK
      run: |
        cd "$GITHUB_WORKSPACE"

        echo "=== Build type: ${{ github.event.inputs.build_type }} ==="

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          p4a apk \
            --private app \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,kivmob,pyjnius==1.5.0 \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --sdk-dir=$SDK_DIR \
            --ndk-dir=$ANDROID_NDK_HOME \
            --android-api=35 \
            --arch=arm64-v8a \
            --dist-name=monapp_release \
            --add-aar=app/libs/play-services-basement-18.5.0.aar \
            --add-aar=app/libs/play-services-tasks-18.3.2.aar \
            --add-aar=app/libs/play-services-ads-24.3.0.aar \
            --meta-data=com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713 \
            --release
        else
          p4a apk \
            --private app \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,kivmob,pyjnius==1.5.0 \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --sdk-dir=$SDK_DIR \
            --ndk-dir=$ANDROID_NDK_HOME \
            --android-api=35 \
            --arch=armeabi-v7a \
            --dist-name=monapp_debug \
            --add-aar=app/libs/play-services-basement-18.5.0.aar \
            --add-aar=app/libs/play-services-tasks-18.3.2.aar \
            --add-aar=app/libs/play-services-ads-24.3.0.aar \
            --meta-data=com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713 \
            --debug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: dist/*.apk
