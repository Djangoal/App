name: Build APK avec Buildozer + AdMob 2

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y python3-pip python3-setuptools python3-kivy openjdk-17-jdk zip unzip libstdc++6 git build-essential libffi-dev libssl-dev libsqlite3-dev libjpeg-dev zlib1g-dev libncurses5-dev libtinfo5

      - name: Install Buildozer + Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython virtualenv

      - name: Setup Android SDK & NDK manually
        run: |
          mkdir -p ~/.buildozer/android/platform
          cd ~/.buildozer/android/platform

          # SDK
          wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O sdktools.zip
          unzip -q sdktools.zip -d sdk
          export ANDROIDSDK=$HOME/.buildozer/android/platform/sdk
          yes | $ANDROIDSDK/cmdline-tools/bin/sdkmanager --sdk_root=$ANDROIDSDK "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          # NDK r23b
          wget https://dl.google.com/android/repository/android-ndk-r23b-linux.zip -O ndk.zip
          unzip -q ndk.zip
          mv android-ndk-r23b ndk
          export ANDROIDNDK=$HOME/.buildozer/android/platform/ndk

      - name: Cleanup previous buildozer state
        run: rm -rf .buildozer bin build dist

      - name: Build APK (Buildozer)
        run: |
          # Export variables pour cette step uniquement
          export ANDROIDNDK=$HOME/.buildozer/android/platform/ndk
          export ANDROIDSDK=$HOME/.buildozer/android/platform/sdk
          export ANDROIDAPI=33
          export ANDROIDMINAPI=21

          echo "=== Build type: ${{ github.event.inputs.build_type }} ==="

          # Redirige le log complet dans build.log
          if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
            yes | buildozer -v android release > build.log 2>&1 || (cat build.log && exit 1)
          else
            yes | buildozer -v android debug > build.log 2>&1 || (cat build.log && exit 1)
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-budget-${{ github.event.inputs.build_type }}
          path: bin/*.apk

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.event.inputs.build_type }}
          path: build.log
