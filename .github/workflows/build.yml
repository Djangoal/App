name: Build APK with Buildozer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: $HOME/android-sdk

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          zip unzip openjdk-17-jdk python3-pip \
          git build-essential libncurses-dev libffi-dev \
          libssl-dev libsqlite3-dev libjpeg-dev \
          zlib1g-dev libpng-dev

    - name: Setup Python & install Buildozer
      run: |
        python3 -m pip install --upgrade pip
        pip install buildozer cython

    - name: Install Android SDK Command Line Tools
      run: |
        mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
        cd $ANDROID_SDK_ROOT
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip cmdline-tools.zip -d cmdline-tools
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/cmdline-tools/* cmdline-tools/latest/
        yes | cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
        echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH

    - name: Install Android Build Tools & Platform Tools
      run: |
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "platform-tools" \
          "build-tools;36.0.0" \
          "platforms;android-36" \
          "ndk;25.2.9519653"

    - name: Build APK with Buildozer
      run: |
        buildozer android debug

    - name: Rename APK
      run: |
        APK_FILE=$(find bin/ -name "*.apk" | head -n 1)
        mv "$APK_FILE" "mon_budget_perso.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-apk
        path: ./mon_budget_perso.apk
