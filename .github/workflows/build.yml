name: Build APK with Buildozer

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show files in repo
        run: ls -la

      - name: Ensure buildozer.spec exists
        run: test -f buildozer.spec

      - name: Disable BuildKit and pull image manually
        run: |
          DOCKER_BUILDKIT=0 docker pull kivy/buildozer:latest

      - name: Run Buildozer in Docker
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
          -w /app kivy/buildozer \
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: bin/*.apk
