name: Build APK with python-for-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libltdl-dev \
          zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python and python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest

        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: Préparer le fichier .spec
      run: |
        mkdir -p app
        echo "[app]" > app/pythonforandroid.spec
        echo "title = Mon budget perso" >> app/pythonforandroid.spec
        echo "package.name = monapp" >> app/pythonforandroid.spec
        echo "package.domain = org.example" >> app/pythonforandroid.spec
        echo "source.dir = ." >> app/pythonforandroid.spec
        echo "version = 0.1" >> app/pythonforandroid.spec
        echo "icon.filename = logo.png" >> app/pythonforandroid.spec
        echo "presplash.filename = app/logo1.png" >> app/pythonforandroid.spec
        echo "requirements = python3,kivy,kivmob,android" >> app/pythonforandroid.spec
        echo "orientation = portrait" >> app/pythonforandroid.spec
        echo "archs = armeabi-v7a" >> app/pythonforandroid.spec
        echo "android.api = 36" >> app/pythonforandroid.spec
        echo "android.ndk = 25b" >> app/pythonforandroid.spec
        echo "android.gradle_dependencies = com.google.android.gms:play-services-ads:22.6.0" >> app/pythonforandroid.spec
        echo "permissions = INTERNET, ACCESS_NETWORK_STATE" >> app/pythonforandroid.spec

    - name: Build APK
      run: |
        source venv/bin/activate
        ./venv/bin/p4a apk \
          --config=app/pythonforandroid.spec \
          --arch=armeabi-v7a \
          --copy-libs \
          --release apk --config=app/pythonforandroid.spec --arch=armeabi-v7a --copy-libs --release
   
    - name: Rename APK
      run: |
        APK_FILE=$(ls *.apk | head -n 1)
        mv "$APK_FILE" "mon_budget_perso.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-apk
        path: ./mon_budget_perso.apk
