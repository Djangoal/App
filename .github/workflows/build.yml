name: Build APK with Buildozer

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python 3.10
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libltdl-dev \
          zip unzip \
          openjdk-17-jdk \
          python3-pip \
          python3-venv \
          libncurses-dev \
          libtool libtool-bin \
          automake autoconf pkg-config m4

    - name: Install Android SDK Command-line Tools
      run: |
        ANDROID_SDK_ROOT="$HOME/.buildozer/android/platform/android-sdk"
        mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
        mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
        rm cmdline-tools.zip

        # Accept licenses
        yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses

        # Install required SDK packages
        "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Install Buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install cython buildozer

    - name: Verify project structure
      run: |
        echo "=== Vérification de la structure ==="
        ls -R
        test -f buildozer.spec || { echo "❌ buildozer.spec introuvable !"; exit 1; }
        test -d app/libs || { echo "❌ Dossier app/libs introuvable !"; exit 1; }
        test -f app/libs/play-services-ads-24.3.0.aar || { echo "❌ Les fichiers .aar sont manquants !"; exit 1; }

    - name: Clean previous builds
      run: |
        rm -rf .buildozer bin
        echo "✅ Nettoyage effectué"

    - name: Build APK
      run: |
        source venv/bin/activate
        echo "=== Type de build : ${{ github.event.inputs.build_type }} ==="
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          buildozer android release
        else
          buildozer android debug
        fi

    - name: Locate APK
      id: locate_apk
      run: |
        APK_PATH=$(find bin/ -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ Aucun APK généré !"
          exit 1
        fi
        echo "✅ APK généré : $APK_PATH"
        echo "apk_path=$APK_PATH" >> $GITHUB_OUTPUT

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ${{ steps.locate_apk.outputs.apk_path }}

    - name: Verify AdMob and Google Services presence
      run: |
        echo "=== Vérification du contenu de l'APK ==="
        APK="${{ steps.locate_apk.outputs.apk_path }}"
        TMP_DIR=$(mktemp -d)
        unzip -q "$APK" -d "$TMP_DIR"
        echo "🕵️ Recherche de AdMob et Google Play Services..."
        if grep -qr "com/google/android/gms/ads" "$TMP_DIR"; then
          echo "✅ AdMob SDK détecté."
        else
          echo "❌ AdMob SDK manquant !"
          exit 1
        fi
        if grep -qr "com/google/android/gms/common" "$TMP_DIR"; then
          echo "✅ Google Play Services détecté."
        else
          echo "❌ Google Play Services manquants !"
          exit 1
        fi
        echo "=== Vérification terminée avec succès ✅ ==="
