name: Build APK 2(unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4
    - name: Setup Python & python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git@c0e1d71
        ./venv/bin/p4a --version
    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"
    - name: Cleanup previous builds
      run: |
        echo "Cleaning old builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/monapp_release
        rm -rf ~/.local/share/python-for-android/dists/monapp_debug
        echo "Environment ready"
            
    - name: Build APK
      run: |
        source venv/bin/activate
        
        echo "=== Build type: ${{ github.event.inputs.build_type }} ==="
        cd "$GITHUB_WORKSPACE"

        echo "=== Vérification des fichiers AAR ==="
        if [ ! -d app/libs ] || [ -z "$(ls -A app/libs/*.aar 2>/dev/null)" ]; then
          echo "❌ Aucun fichier .aar trouvé dans app/libs !"
          exit 1
        fi

        echo "=== Copie du manifest personnalisé ==="
        mkdir -p ~/.local/share/python-for-android/templates/
        cp app/templates/AndroidManifest.tmpl.xml ~/.local/share/python-for-android/templates/AndroidManifest.tmpl.xml

        echo "=== Liste des AAR à inclure ==="
        ADD_AARS=""
        for aar in $GITHUB_WORKSPACE/app/libs/*.aar; do
          echo "→ Inclusion de $aar"
          ADD_AARS="$ADD_AARS --aar=$aar"
        done

        echo "=== Début de la compilation ==="

        COMMON_ARGS="--private $GITHUB_WORKSPACE/app \
          --package=org.example.monapp \
          --name='Mon_budget_perso' \
          --version=1.0 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=35 \
          --orientation=portrait \
          $ADD_AARS \
          --meta-data=com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713"

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "=== Compilation RELEASE ==="
          ./venv/bin/p4a apk \
            $COMMON_ARGS \
            --arch=arm64-v8a \
            --dist-name=monapp_release \
            --release \
            --use-androidx || { echo '❌ Erreur de compilation release'; exit 1; }

          APK_PATH=$(find . -type f -name "*release-unsigned*.apk" | head -n 1)
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK release trouvé !"
            find . -type f -name "*.apk"
            exit 1
          fi
          echo "✅ APK release trouvé : $APK_PATH"
          cp "$APK_PATH" "$FINAL_APK"
          $SDK_DIR/build-tools/35.0.0/zipalign -v 4 "$FINAL_APK" "${FINAL_APK%.apk}-aligned.apk"

        else
          echo "=== Compilation DEBUG ==="
          ./venv/bin/p4a apk \
            $COMMON_ARGS \
            --arch=armeabi-v7a \
            --dist-name=monapp_debug \
            --debug \
            --use-androidx || { echo '❌ Erreur de compilation debug'; exit 1; }

          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK debug trouvé !"
            find . -type f -name "*.apk"
            exit 1
          fi
          echo "✅ APK debug trouvé : $APK_PATH"
          cp "$APK_PATH" "$FINAL_APK"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk

    - name: Verify AdMob presence
      run: |
        echo "=== Vérification de la présence de AdMob dans l'APK ==="
        APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ Aucun APK trouvé pour vérification !"
          exit 1
        fi
        TMP_DIR=$(mktemp -d)
        unzip -q "$APK_PATH" -d "$TMP_DIR"
        if grep -qr "com/google/android/gms/ads" "$TMP_DIR"; then
          echo "✅ AdMob SDK trouvé dans l'APK."
        else
          echo "❌ AdMob SDK NON trouvé !"
          exit 1
        fi
        rm -rf "$TMP_DIR"
