name: Build Release APK (with AdMob)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4
          python3 -m venv venv
          source venv/bin/activate
          pip install --upgrade pip cython
          pip install git+https://github.com/kivy/python-for-android.git

      - name: Download Android SDK & NDK
        run: |
          mkdir -p $SDK_DIR
          curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
          unzip -q cmdline-tools.zip -d $SDK_DIR
          mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
          mkdir -p $SDK_DIR/cmdline-tools/latest
          mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
          yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
          $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

      - name: Clean old builds
        run: |
          rm -rf .buildozer dist build bin
          ./venv/bin/p4a clean_builds || true
          rm -rf ~/.local/share/python-for-android/dists/monapp_release

      - name: Copy custom manifest
        run: |
          mkdir -p ~/.local/share/python-for-android/templates/
          cp app/templates/AndroidManifest.tmpl.xml ~/.local/share/python-for-android/templates/AndroidManifest.tmpl.xml

      - name: Build release dist with p4a
        run: |
          source venv/bin/activate
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --arch=arm64-v8a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --orientation=portrait \
            --dist-name=monapp_release \
            --release \
            --copy-libs

      - name: Add AdMob Gradle dependency
        run: |
          echo "Ajout du service AdMob dans le projet Gradle..."
          DIST_PATH="$HOME/.local/share/python-for-android/dists/monapp_release"
          BUILD_GRADLE="$DIST_PATH/build.gradle"
          if [ -f "$BUILD_GRADLE" ]; then
            echo "🔧 Insertion propre de la dépendance dans le bloc dependencies..."
            sed -i "/dependencies {/a\    implementation 'com.google.android.gms:play-services-ads:24.3.0'" "$BUILD_GRADLE"
            echo "✅ Dépendance ajoutée avec succès."
          else
            echo "❌ build.gradle introuvable !"
            exit 1
          fi

      - name: Build release APK with Gradle
        run: |
          DIST_PATH="$HOME/.local/share/python-for-android/dists/monapp_release"
          cd "$DIST_PATH"
          ./gradlew assembleRelease --stacktrace --warning-mode all

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: mon-budget-release
          path: mon_budget_perso_release_aligned.apk
