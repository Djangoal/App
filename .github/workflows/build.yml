name: Build APK (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # ⚡️ Cache Buildozer, Gradle et python-for-android
    - name: Cache Buildozer & Gradle
      uses: actions/cache@v3
      with:
        path: |
          ~/.buildozer
          ~/.gradle
          ~/.local/share/python-for-android
        key: buildozer-cache-${{ runner.os }}-${{ github.sha }}
        restore-keys: |
          buildozer-cache-${{ runner.os }}-

    # 🔧 Installer toutes les dépendances système nécessaires
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential autoconf automake libtool pkg-config m4 \
          python3 python3-venv python3-pip \
          zip unzip openjdk-17-jdk \
          libffi-dev libssl-dev liblzma-dev zlib1g-dev libncurses5-dev libsqlite3-dev \
          libjpeg-dev libfreetype6-dev libpng-dev \
          libsdl2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

    # ⚡️ Installer Python + Buildozer dans le venv
    - name: Setup Python & Buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install cython buildozer==1.5.0

    # 🧹 Nettoyage des builds précédents
    - name: Clean old builds
      run: rm -rf .buildozer build bin dist

    # 🏗️ Build APK
    - name: Build APK
      run: |
        source venv/bin/activate
        echo "=== Building ${{ github.event.inputs.build_type }} APK ==="
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          buildozer android release
          APK_PATH=$(find bin -name "*release*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
        else
          buildozer android debug
          APK_PATH=$(find bin -name "*debug*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi

    # 📤 Upload APK
    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk
