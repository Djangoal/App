name: Build APK (p4a)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup Python & p4a
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip cython
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Verify AAR files
      run: |
        echo "=== Vérification des .aar ==="
        ls -l app/libs/*.aar || { echo "❌ Les fichiers .aar sont introuvables !"; exit 1; }

    - name: Build APK
      run: |
        source venv/bin/activate
        cd "$GITHUB_WORKSPACE"

        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          BUILD_ARGS="--release --arch=arm64-v8a --dist-name=monapp_release"
        else
          BUILD_ARGS="--debug --arch=armeabi-v7a --dist-name=monapp_debug"
        fi

        echo "=== Compilation ${{ github.event.inputs.build_type }} ==="
        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=1.3 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android \
          --permission WRITE_EXTERNAL_STORAGE \
          --permission READ_EXTERNAL_STORAGE \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=35 \
          --orientation=portrait \
          $BUILD_ARGS \
          --add-aars=app/libs/play-services-ads-20.3.0.aar,app/libs/play-services-ads-lite-20.3.0.aar \
          --meta-data=com.google.android.gms.ads.APPLICATION_ID=ca-app-pub-3940256099942544~3347511713

        # Copier l’APK généré vers la racine du workspace
        APK_PATH=$(find . -type f -name "*${{ github.event.inputs.build_type }}*.apk" | head -n 1)
        if [ -z "$APK_PATH" ]; then
          echo "❌ Aucun APK trouvé !"
          exit 1
        fi
        FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_${{ github.event.inputs.build_type }}.apk"
        cp "$APK_PATH" "$FINAL_APK"
        echo "✅ APK généré : $FINAL_APK"

    - name: Verify AdMob classes in APK
      run: |
        echo "=== Vérification des classes AdMob dans l'APK ==="
        APK_PATH="$GITHUB_WORKSPACE/mon_budget_perso_${{ github.event.inputs.build_type }}.apk"
        TMP_DIR=$(mktemp -d)
        unzip -q "$APK_PATH" -d "$TMP_DIR"

        CLASSES=("Lcom/google/android/gms/ads/AdView;" "Lcom/google/android/gms/ads/AdRequest;" "Lcom/google/android/gms/ads/AdListener;")
        MISSING=0

        for cls in "${CLASSES[@]}"; do
          if ! grep -qr "$cls" "$TMP_DIR"; then
            echo "❌ Classe manquante : $cls"
            MISSING=1
          else
            echo "✅ Classe trouvée : $cls"
          fi
        done

        rm -rf "$TMP_DIR"

        if [ $MISSING -eq 1 ]; then
          echo "⚠️ Certaines classes AdMob sont absentes de l'APK !"
          exit 1
        else
          echo "✅ Toutes les classes AdMob attendues sont présentes dans l'APK."
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}.apk
