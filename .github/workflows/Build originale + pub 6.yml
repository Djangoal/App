name: Build originale + pub 6

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build"
        required: true
        default: "sans_pub_debug"
        type: choice
        options:
          - sans_pub_debug
          - sans_pub_release
          - avec_pub_debug
          - avec_pub_release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4 aapt

    - name: Setup Python & python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install --upgrade git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Cleanup previous builds
      run: |
        echo "Cleaning old builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true
        rm -rf ~/.local/share/python-for-android/dists/*

    - name: Build APK
      run: |
        source venv/bin/activate
        cd "$GITHUB_WORKSPACE"
        echo "=== TYPE DE BUILD : ${{ github.event.inputs.build_type }} ==="

        mkdir -p ~/.local/share/python-for-android/templates/
        cp app/templates/AndroidManifest.tmpl.xml ~/.local/share/python-for-android/templates/AndroidManifest.tmpl.xml

        #######################################
        # SANS PUB - DEBUG
        #######################################
        if [ "${{ github.event.inputs.build_type }}" = "sans_pub_debug" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --dist-name=monapp_debug \
            --debug
          APK_PATH=$(find . -type f -name "*debug*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi

        #######################################
        # SANS PUB - RELEASE
        #######################################
        if [ "${{ github.event.inputs.build_type }}" = "sans_pub_release" ]; then
          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --orientation=portrait \
            --arch=arm64-v8a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --dist-name=monapp_release \
            --release
          APK_PATH=$(find . -type f -name "*release-unsigned*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
          $SDK_DIR/build-tools/35.0.0/zipalign -v 4 "$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk" "$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned-aligned.apk"
        fi

        #######################################
        # AVEC PUB
        #######################################
        if [ "${{ github.event.inputs.build_type }}" = "avec_pub_debug" ] || [ "${{ github.event.inputs.build_type }}" = "avec_pub_release" ]; then
          echo "=== BUILD AVEC PUB ==="

          # Installer kivmob 2.0
          ./venv/bin/pip install --upgrade kivmob==2.0
          ./venv/bin/python -c "import kivmob; print('KivMob import OK')"
          
          # Nettoyer builds précédentes
          ./venv/bin/p4a clean_builds || true
          rm -rf ~/.local/share/python-for-android/dists/*

          if [ "${{ github.event.inputs.build_type }}" = "avec_pub_debug" ]; then
            ARCH=armeabi-v7a
            DEBUG_FLAG="--debug"
            DIST_NAME="monapp_pub_debug"
            APK_OUTPUT="mon_budget_perso_pub_debug.apk"
          else
            ARCH=arm64-v8a
            DEBUG_FLAG="--release"
            DIST_NAME="monapp_pub_release"
            APK_OUTPUT="mon_budget_perso_pub_release_unsigned.apk"
          fi

          ./venv/bin/p4a apk \
            --private "$GITHUB_WORKSPACE/app" \
            --package=org.example.monapp.pub \
            --name="Mon budget perso (pub)" \
            --version=1.0 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,kivmob,android,pyjnius \
            --permission INTERNET \
            --permission ACCESS_NETWORK_STATE \
            --permission ACCESS_WIFI_STATE \
            --orientation=portrait \
            --arch=$ARCH \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=35 \
            --dist-name=$DIST_NAME \
            $DEBUG_FLAG \
            --copy-libs

          APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/$APK_OUTPUT"

          if [ "${{ github.event.inputs.build_type }}" = "avec_pub_release" ]; then
            $SDK_DIR/build-tools/35.0.0/zipalign -v 4 "$GITHUB_WORKSPACE/$APK_OUTPUT" "$GITHUB_WORKSPACE/mon_budget_perso_pub_release_aligned.apk"
          fi

          echo "=== Build avec pub terminé : $APK_OUTPUT ==="
        fi

    ###############################################
    # Vérification du contenu APK + AdMob
    ###############################################
    - name: Verify APK content
      run: |
        echo "=== Vérification du contenu APK ==="
        APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
        echo "APK détecté : $APK_FILE"
        echo "=== Classes Google Ads ==="
        unzip -l "$APK_FILE" | grep -E "gms|ads" || echo "⚠️ Aucune classe Google Ads trouvée"
        echo "=== Vérification Manifest : APPLICATION_ID ==="
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -i "APPLICATION_ID" || echo "⚠️ App ID AdMob manquant"
        echo "=== Vérification Permissions Réseau ==="
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -E "INTERNET|ACCESS_NETWORK_STATE" || echo "⚠️ Permissions manquantes"
        echo "=== Vérification SDK Google Ads présent ==="
        if unzip -l "$APK_FILE" | grep -q "com/google/android/gms/ads"; then
          echo "✔️ Google Ads détecté dans l’APK"
        else
          echo "❌ Google Ads ABSENT — le bandeau pub NE PEUT PAS fonctionner"
          exit 1
        fi
        echo "=== Vérification terminée ==="

    ###############################################
    # Génération du rapport HTML AdMob
    ###############################################
    - name: Generate AdMob Diagnostics Report
      run: |
        echo "=== Génération du rapport HTML AdMob ==="
        APK_FILE=$(find "$GITHUB_WORKSPACE" -type f -name "*.apk" | head -n 1)
        REPORT="$GITHUB_WORKSPACE/report_admob.html"
        echo "<html><head><meta charset='UTF-8'><title>AdMob Diagnostics Report</title></head><body>" > "$REPORT"
        echo "<h1>📊 Rapport de diagnostic AdMob</h1>" >> "$REPORT"
        echo "<p><strong>APK analysé :</strong> $APK_FILE</p>" >> "$REPORT"
        echo "<hr>" >> "$REPORT"
        echo "<h2>🧩 AndroidManifest.xml</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml >> "$REPORT" 2>&1
        echo "</pre><hr>" >> "$REPORT"
        echo "<h2>🔐 Permissions détectées</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -E "uses-permission" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"
        echo "<h2>📌 App ID AdMob</h2><pre>" >> "$REPORT"
        aapt dump xmltree "$APK_FILE" AndroidManifest.xml | grep -i "APPLICATION_ID" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"
        echo "<h2>📚 Classes Google Ads dans l'APK</h2><pre>" >> "$REPORT"
        unzip -l "$APK_FILE" | grep -i "com/google/android/gms/ads" >> "$REPORT" || echo "Aucune classe Ads" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"
        echo "<h2>📦 Contenu complet de l'APK</h2><pre>" >> "$REPORT"
        unzip -l "$APK_FILE" >> "$REPORT"
        echo "</pre><hr>" >> "$REPORT"
        echo "<p>⏳ Analyse terminée automatiquement via GitHub Actions.</p>" >> "$REPORT"
        echo "</body></html>" >> "$REPORT"
        echo "Rapport généré : $REPORT"

    - name: Upload AdMob Report
      uses: actions/upload-artifact@v4
      with:
        name: rapport-admob
        path: ${{ github.workspace }}/report_admob.html

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ${{ github.workspace }}/mon_budget_perso_debug.apk
          ${{ github.workspace }}/mon_budget_perso_release_unsigned*.apk
          ${{ github.workspace }}/mon_budget_perso_pub_debug.apk
          ${{ github.workspace }}/mon_budget_perso_pub_release_unsigned*.apk
