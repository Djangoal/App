name: Build 2026.06

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    # ✅ Python stable (OBLIGATOIRE pour Kivy)
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libltdl-dev zip unzip \
          openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin \
          automake autoconf pkg-config m4

    # ✅ ENV PYTHON (VERSION STABLE RÉELLE)
    - name: Setup venv + python-for-android
      run: |
        python -m venv venv
        ./venv/bin/pip install --upgrade pip setuptools wheel cython

        # 🔥 VERSION STABLE RÉELLE (PAS 2024 BUGGY)
        ./venv/bin/pip install "python-for-android==2023.9.16"

        # 🔥 FIX JNI (évite erreur long + compilation cassée)
        ./venv/bin/pip install "pyjnius==1.6.1"

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR

        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR

        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest

        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses

        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Clean builds
      run: |
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true

    - name: Build APK
      shell: bash
      run: |
       set -e

       source venv/bin/activate
       cd "$GITHUB_WORKSPACE"

       export ANDROID_SDK_ROOT=$SDK_DIR
       export ANDROID_NDK_ROOT=$ANDROID_NDK_HOME
       export PATH=$SDK_DIR/cmdline-tools/latest/bin:$PATH
       export PATH=$SDK_DIR/platform-tools:$PATH

       export CC=clang
       export CXX=clang++

       export CFLAGS="-Wno-error=incompatible-function-pointer-types"

       echo "=== Build type: ${{ github.event.inputs.build_type }} ==="

       if [ "${{ github.event.inputs.build_type }}" = "release" ]; then

       echo "=== RELEASE BUILD ==="

        ./venv/bin/p4a apk \
        --private "$GITHUB_WORKSPACE/app" \
        --package=org.example.monapp \
        --name="Mon budget perso" \
        --version=1.0 \
        --bootstrap=sdl2 \
        --icon=logo.png \
        --presplash=app/logo1.png \
        --requirements=python3,kivy \
        --permission INTERNET \
        --permission ACCESS_NETWORK_STATE \
        --arch=arm64-v8a \
        --sdk_dir="$SDK_DIR" \
        --ndk_dir="$ANDROID_NDK_HOME" \
        --android_api=35 \
        --orientation=portrait \
        --dist-name=monapp_release \
        --release

       else

        echo "=== DEBUG BUILD ==="

        ./venv/bin/p4a apk \
        --private "$GITHUB_WORKSPACE/app" \
        --package=org.example.monapp \
        --name="Mon budget perso" \
        --version=1.0 \
        --bootstrap=sdl2 \
        --icon=logo.png \
        --presplash=app/logo1.png \
        --requirements=python3,kivy \
        --permission INTERNET \
        --permission ACCESS_NETWORK_STATE \
        --arch=arm64-v8a \
        --sdk_dir="$SDK_DIR" \
        --ndk_dir="$ANDROID_NDK_HOME" \
        --android_api=35 \
        --orientation=portrait \
        --dist-name=monapp_debug \
        --debug

       fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./*.apk
