name: Build APK with python-for-android

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool automake autoconf pkg-config m4

    - name: Setup p4a
      run: |
        python3 -m venv venv
        . venv/bin/activate
        pip install --upgrade pip
        pip install cython
        pip install git+https://github.com/kivy/python-for-android.git

    - name: Download SDK/NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o tools.zip
        unzip tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;25.2.9519653"

    - name: Clean build environment
      run: |
        . venv/bin/activate
        p4a clean --private ./app

    - name: Build APK
      run: |
        . venv/bin/activate
        p4a apk --private ./app \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=0.1 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --requirements=python3,kivy,android \
          --arch=armeabi-v7a \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=36

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: ./*.apk
