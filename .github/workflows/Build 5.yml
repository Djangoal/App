name: Build APK 5(unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options: [debug, release]

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python & p4a
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK & NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Copy custom manifest
      run: |
        mkdir -p ~/.local/share/python-for-android/templates/
        cp app/templates/AndroidManifest.tmpl.xml ~/.local/share/python-for-android/templates/

    - name: Copy AdMob recipe
      run: |
        mkdir -p ~/.local/share/python-for-android/recipes/admob
        cp -r python-for-android/recipes/admob/* ~/.local/share/python-for-android/recipes/admob/

    - name: Clean previous builds
      run: |
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true

    - name: Build APK
      run: |
        source venv/bin/activate

        if [ "${{ github.event.inputs.build_type }}" == "release" ]; then
          BUILD_MODE="--release"
        else
          BUILD_MODE="--debug"
        fi

        ./venv/bin/p4a apk \
          --private "$GITHUB_WORKSPACE/app" \
          --package=org.example.monapp \
          --name="Mon budget perso" \
          --version=1.0 \
          --bootstrap=sdl2 \
          --icon=logo.png \
          --presplash=app/logo1.png \
          --requirements=python3,kivy,android,pyjnius,admob \
          --permission INTERNET \
          --permission ACCESS_NETWORK_STATE \
          --arch=arm64-v8a \
          --sdk_dir=$SDK_DIR \
          --ndk_dir=$ANDROID_NDK_HOME \
          --android_api=35 \
          --orientation=portrait \
          --dist-name=mon_budget_perso \
          $BUILD_MODE

    - name: Find APK
      run: |
        APK=$(find bin -type f -name "*.apk" | head -n 1)
        echo "📦 APK trouvé : $APK"
        if [ -z "$APK" ]; then
          echo "❌ Aucun APK trouvé !"
          exit 1
        fi
        echo "APK=$APK" >> $GITHUB_ENV

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: apk-${{ github.event.inputs.build_type }}
        path: ${{ env.APK }}

    - name: Check for AAR files in APK
      run: |
        echo "🔍 Vérification des AAR dans: ${{ env.APK }}"
        unzip -l "${{ env.APK }}" | grep .aar || echo "⚠️ Aucun AAR trouvé !"

    - name: Make script executable
      run: chmod +x tools/check_post_build.sh

    - name: Vérification post-build
      run: bash tools/check_post_build.sh "${{ env.APK }}"
