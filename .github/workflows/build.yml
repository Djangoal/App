name: Build APK (unsigned)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          zip unzip \
          openjdk-17-jdk \
          python3 python3-venv python3-pip \
          libffi-dev libssl-dev liblzma-dev \
          zlib1g-dev libncurses5-dev libsqlite3-dev \
          libjpeg-dev libfreetype6-dev

    - name: Setup Python & Buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install cython buildozer==1.5.0

    - name: Download Android SDK + NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest

        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: Accept Android licenses
      run: |
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses || true

    - name: Clean previous builds
      run: |
        rm -rf .buildozer build bin dist

    - name: Build APK
      run: |
        source venv/bin/activate
        echo "=== Building ${{ github.event.inputs.build_type }} APK ==="
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          buildozer android release
          APK_PATH=$(find bin -name "*release*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
        else
          buildozer android debug
          APK_PATH=$(find bin -name "*debug*.apk" | head -n 1)
          cp "$APK_PATH" "$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk
