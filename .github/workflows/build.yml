name: Build APK (Buildozer)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git python3-pip python3-virtualenv \
          openjdk-17-jdk unzip zip zlib1g-dev \
          libncurses5-dev libffi-dev libssl-dev \
          autoconf automake libtool pkg-config

    - name: Setup Python and Buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip
        pip install cython buildozer

    - name: Clean previous builds
      run: |
        source venv/bin/activate
        buildozer android clean || true

    - name: Build APK
      run: |
        source venv/bin/activate
        BUILD_TYPE="${{ github.event.inputs.build_type }}"
        if [ "$BUILD_TYPE" = "release" ]; then
          echo "=== Building release APK ==="
          buildozer android release
          APK=$(find bin -name "*.apk" | grep "release")
        else
          echo "=== Building debug APK ==="
          buildozer android debug
          APK=$(find bin -name "*.apk" | grep "debug")
        fi
        echo "✅ APK built: $APK"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ${{ github.workspace }}/$APK
