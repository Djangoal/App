name: Build APK Release Direct

on:
  workflow_dispatch:

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: 🧩 Checkout repo
      uses: actions/checkout@v4

    - name: 📄 Afficher contenu buildozer.spec
      run: |
        echo "=== CONTENU DU buildozer.spec ==="
        cat buildozer.spec

    # -----------------------------------------
    # ENVIRONMENT
    # -----------------------------------------
    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: 🔧 Install Buildozer
      run: |
        python -m pip install --upgrade pip setuptools
        pip install cython==0.29.33
        pip install buildozer

    - name: 📱 Install Android SDK + Build tools
      run: |
        mkdir -p $HOME/Android/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O tools.zip
        unzip tools.zip -d $HOME/Android/cmdline-tools
        yes | $HOME/Android/cmdline-tools/cmdline-tools/bin/sdkmanager --sdk_root=$HOME/Android --licenses
        $HOME/Android/cmdline-tools/cmdline-tools/bin/sdkmanager \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2" \
          "ndk;25.2.9519653"

    - name: 🔧 Configure Android env
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/Android" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/cmdline-tools/cmdline-tools/bin:$HOME/Android/platform-tools:$PATH" >> $GITHUB_ENV

    # -----------------------------------------
    # 🧨 SUPPRIMER LES ANCIENS BUILD BUILDIZER
    # -----------------------------------------
    - name: 🚨 Remove ALL Buildozer caches
      run: |
        echo "Deleting ALL buildozer caches…"
        rm -rf ~/.buildozer
        rm -rf .buildozer
        rm -rf bin
        rm -rf */bin
        echo "Cleanup complete!"

    # -----------------------------------------
    # 🏗 BUILD APK RELEASE ONLY
    # -----------------------------------------
    - name: 🏗️ Build APK RELEASE (NO AAB)
      run: |
        echo "📦 Building APK RELEASE ONLY"
        buildozer --verbose android release

    # -----------------------------------------
    # LIST OUTPUTS
    # -----------------------------------------
    - name: 📂 List build outputs
      run: |
        echo "📁 Contenu du dossier bin :"
        ls -lh ./bin

    # -----------------------------------------
    # UPLOAD APK
    # -----------------------------------------
    - name: 📤 Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: APK-release
        path: ./bin/*.apk
