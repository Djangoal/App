name: Build APK with python-for-android

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      SDK_DIR: ${{ github.workspace }}/android-sdk
      NDK_DIR: ${{ github.workspace }}/android-sdk/ndk
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential libltdl-dev \
          zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Setup Python, virtualenv and install python-for-android
      run: |
        python3 -m venv venv
        ./venv/bin/pip install --upgrade pip
        ./venv/bin/pip install cython
        ./venv/bin/pip install git+https://github.com/kivy/python-for-android.git

    - name: Download Android SDK and NDK
      run: |
        mkdir -p $SDK_DIR
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip cmdline-tools.zip -d $SDK_DIR
        mv $SDK_DIR/cmdline-tools $SDK_DIR/cmdline-tools-temp
        mkdir -p $SDK_DIR/cmdline-tools/latest
        mv $SDK_DIR/cmdline-tools-temp/* $SDK_DIR/cmdline-tools/latest
        yes | $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR --licenses
        $SDK_DIR/cmdline-tools/latest/bin/sdkmanager --sdk_root=$SDK_DIR \
          "platform-tools" \
          "platforms;android-36" \
          "build-tools;36.0.0" \
          "ndk;25.2.9519653"

    - name: 🧹 Préparation avant build
      run: |
        echo "🧹 Nettoyage des anciens builds..."
        rm -rf .buildozer dist build bin
        ./venv/bin/p4a clean_builds || true

        echo "📦 Version de python-for-android :"
        ./venv/bin/p4a --version

        echo "🧩 Vérification Java et Android SDK/NDK"
        java -version
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"
        echo "SDK_DIR=$SDK_DIR"
        echo "Contenu du SDK :"
        ls -l $SDK_DIR || true
        echo "Contenu du NDK :"
        ls -l $NDK_DIR || true

        echo "✅ Environnement prêt pour compilation."

    - name: Ajouter setup.py minimal
      run: |
        echo "from setuptools import setup
setup(
    name='monapp',
    version='0.1',
    packages=['.'],
)" > ./app/setup.py

    - name: Build APK
      run: |
        source venv/bin/activate
        BUILD_TYPE="${{ github.event.inputs.build_type }}"
        echo "🚀 Type de build : $BUILD_TYPE"

        if [ "$BUILD_TYPE" = "release" ]; then
          echo "🔒 Compilation en mode RELEASE..."
          ./venv/bin/p4a apk \
            --private ./app \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp \
            --release \
            --sign
        else
          echo "🐞 Compilation en mode DEBUG..."
          ./venv/bin/p4a apk \
            --private ./app \
            --package=org.example.monapp \
            --name="Mon budget perso" \
            --version=0.1 \
            --bootstrap=sdl2 \
            --icon=logo.png \
            --presplash=app/logo1.png \
            --requirements=python3,kivy,android \
            --permission WRITE_EXTERNAL_STORAGE \
            --permission READ_EXTERNAL_STORAGE \
            --arch=armeabi-v7a \
            --sdk_dir=$SDK_DIR \
            --ndk_dir=$ANDROID_NDK_HOME \
            --android_api=36 \
            --orientation=portrait \
            --dist-name=monapp \
            --debug
        fi

    - name: Rename APK
      run: |
        APK_FILE=$(find . -name "*.apk" | head -n 1)
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          mv "$APK_FILE" "mon_budget_perso_release.apk"
        else
          mv "$APK_FILE" "mon_budget_perso_debug.apk"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: ./mon_budget_perso_${{ github.event.inputs.build_type }}.apk
