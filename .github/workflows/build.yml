name: Build APK (Buildozer)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          python3 python3-pip python3-venv python3-dev \
          git zip unzip openjdk-17-jdk \
          build-essential autoconf automake libtool libtool-bin pkg-config m4 \
          gettext texinfo \
          libncurses-dev zlib1g-dev libffi-dev libssl-dev libsqlite3-dev \
          libjpeg-dev libfreetype6-dev libgl1-mesa-dev libgles2-mesa-dev \
          liblzma-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
          ccache

        echo "✅ System dependencies installed successfully"
        autoconf --version
        automake --version

    - name: Setup Python virtualenv and Buildozer
      run: |
        python3 -m venv venv
        source venv/bin/activate
        pip install --upgrade pip setuptools wheel
        pip install cython
        pip install buildozer

    - name: Cleanup previous builds
      run: |
        source venv/bin/activate
        echo "🧹 Cleaning previous builds..."
        buildozer android clean || true
        rm -rf .buildozer bin

    - name: Build APK
      run: |
        set -e
        source venv/bin/activate
        BUILD_TYPE=${{ github.event.inputs.build_type }}
        echo "🏗️ Build type: $BUILD_TYPE"
        if [ "$BUILD_TYPE" = "release" ]; then
          echo "=== Building unsigned release APK ==="
          buildozer android release
          APK_PATH=$(find ./.buildozer/android/platform/build/dists -type f -name "*release-unsigned.apk" | head -n 1)
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_release_unsigned.apk"
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK release trouvé !"
            exit 1
          fi
          cp "$APK_PATH" "$FINAL_APK"
          echo "✅ APK release non signé généré : $FINAL_APK"
        else
          echo "=== Building debug APK ==="
          buildozer android debug
          APK_PATH=$(find ./.buildozer/android/platform/build/dists -type f -name "*debug.apk" | head -n 1)
          FINAL_APK="$GITHUB_WORKSPACE/mon_budget_perso_debug.apk"
          if [ -z "$APK_PATH" ]; then
            echo "❌ Aucun APK debug trouvé !"
            exit 1
          fi
          cp "$APK_PATH" "$FINAL_APK"
          echo "✅ APK debug généré : $FINAL_APK"
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./mon_budget_perso_${{ github.event.inputs.build_type }}*.apk
