name: Build APK with Buildozer

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List files
        run: ls -la

      - name: Ensure buildozer.spec exists
        run: test -f buildozer.spec

      - name: Pull specific version of Buildozer image (stable-python3)
        run: docker pull kivy/buildozer:stable-python3

      - name: Build APK with Buildozer
        run: |
          docker run --rm -v ${{ github.workspace }}:/app \
          -w /app kivy/buildozer:stable-python3 \
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-app-debug-apk
          path: bin/*.apk
