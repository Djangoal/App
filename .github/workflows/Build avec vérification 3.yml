name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: 🧩 Checkout repo
      uses: actions/checkout@v4

    # Fix UTF-8 locale
    - name: 🌍 Fix UTF-8 locale
      run: |
        sudo locale-gen en_US.UTF-8
        sudo update-locale LANG=en_US.UTF-8
        echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
        echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

    # Clean build caches (IMPORTANT)
    - name: 🧹 Clean old Buildozer & SDK folders
      run: |
        rm -rf .buildozer
        rm -rf $HOME/.buildozer
        rm -rf ~/.cache/pip
        rm -rf $HOME/Android

    - name: ▶️ Display selected build type
      run: |
        echo "Selected: ${{ github.event.inputs.build_type }}"

    # Install Python 3.9 (jnius compatible)
    - name: 🐍 Set up Python 3.9
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    # System deps
    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    # Buildozer + Cython stable version
    - name: 🔧 Install Buildozer + Kivy deps
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install cython==0.29.33
        pip install buildozer
        pip install kivy==2.2.1

    # Install *ONLY* SDK 33 + Build-Tools 33.0.2
    - name: 📱 Install Android SDK (API 33)
      run: |
        mkdir -p $HOME/Android/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip -d $HOME/Android/cmdline-tools
        mv $HOME/Android/cmdline-tools/cmdline-tools $HOME/Android/cmdline-tools/latest
        export ANDROID_SDK_ROOT=$HOME/Android
        export PATH=$HOME/Android/cmdline-tools/latest/bin:$PATH
        yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    # Export environment for Buildozer
    - name: 🔧 Configure Android env
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/Android" >> $GITHUB_ENV
        echo "ANDROID_HOME=$HOME/Android" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/cmdline-tools/latest/bin:$PATH" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/build-tools/33.0.2:$PATH" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/platform-tools:$PATH" >> $GITHUB_ENV

    # Build the APK
    - name: 🏗️ Build APK with Buildozer
      run: |
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          buildozer --verbose android release
        else
          buildozer --verbose android debug
        fi

    # List outputs
    - name: 🔍 List build outputs
      run: |
        ls -lh ./bin

    # Upload artifacts
    - name: 📤 Upload APK / AAB
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./bin/*${{ github.event.inputs.build_type }}*.apk
          ./bin/*unsigned*.apk
          ./bin/*.aab
