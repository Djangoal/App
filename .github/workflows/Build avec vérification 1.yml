name: Build avec vérification 1

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug ou release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build_android:
    runs-on: ubuntu-latest

    steps:
    - name: 🧩 Checkout repo
      uses: actions/checkout@v4

    - name: 🌍 Fix UTF-8 locale
      run: |
        sudo locale-gen en_US.UTF-8
        sudo update-locale LANG=en_US.UTF-8
        echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
        echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

    - name: 🧹 Clean previous Android SDK / build
      run: |
        echo "Suppression des anciens SDK / dossiers de build pour éviter Build-Tools 36..."
        rm -rf .buildozer/android/platform/android-sdk
        rm -rf .buildozer/android/platform/build

    - name: ▶️ Display selected build type
      run: |
        echo "Selected build type: ${{ github.event.inputs.build_type }}"

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📦 Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libltdl-dev zip unzip openjdk-17-jdk python3-pip \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: 🔧 Install Buildozer + Kivy
      run: |
        python -m pip install --upgrade pip setuptools cython==0.29.33 wheel
        pip install buildozer
        pip install kivy

    - name: 📱 Install Android SDK + Build tools (API 33 + Build-Tools 33.0.2)
      run: |
        mkdir -p $HOME/Android/cmdline-tools
        wget https://dl.google.com/android/repository/commandlinetools-linux-9123335_latest.zip -O cmdline-tools.zip
        unzip cmdline-tools.zip -d $HOME/Android/cmdline-tools
        mv $HOME/Android/cmdline-tools/cmdline-tools $HOME/Android/cmdline-tools/latest

        # Utiliser uniquement CE sdkmanager
        export ANDROID_SDK_ROOT=$HOME/Android
        export PATH=$HOME/Android/cmdline-tools/latest/bin:$PATH

        # Accepter les licences sans installer d'autres versions
        yes | sdkmanager --licenses --sdk_root=$ANDROID_SDK_ROOT > /dev/null

        # Installer uniquement API 33 + Build-Tools 33.0.2
        sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "platform-tools" \
          "platforms;android-33" \
          "build-tools;33.0.2"

    - name: 📦 Install apktool (optionnel)
      run: |
        sudo apt-get update
        sudo apt-get install -y apktool

    - name: 🔧 Configure Android env
      run: |
        echo "ANDROID_SDK_ROOT=$HOME/Android" >> $GITHUB_ENV
        echo "PATH=$HOME/Android/cmdline-tools/latest/bin:$HOME/Android/platform-tools:$HOME/Android/build-tools/33.0.2:$PATH" >> $GITHUB_ENV

    - name: 🏗️ Build APK with Buildozer
      run: |
        if [ "${{ github.event.inputs.build_type }}" = "release" ]; then
          echo "Building RELEASE..."
          buildozer --verbose android release
        else
          echo "Building DEBUG..."
          buildozer --verbose android debug
        fi

    - name: 🔍 List build outputs
      run: |
        echo "📁 Contenu du dossier bin :"
        ls -lh ./bin

    - name: 📤 Upload APK / AAB
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./bin/*${{ github.event.inputs.build_type }}*.apk
          ./bin/*${{ github.event.inputs.build_type }}*.aab
          ./bin/*unsigned*.apk
