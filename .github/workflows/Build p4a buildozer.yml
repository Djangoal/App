name: Build (Buildozer + p4a fork for AdMob)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: "Type de build (debug or release)"
        required: true
        default: "debug"
        type: choice
        options:
          - debug
          - release

jobs:
  build_buildozer:
    runs-on: ubuntu-latest
    env:
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-sdk/ndk/25.2.9519653
      ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system deps
      run: |
        sudo apt-get update
        sudo apt-get install -y zip unzip openjdk-17-jdk wget build-essential libltdl-dev \
          libncurses-dev libtool libtool-bin automake autoconf pkg-config m4

    - name: Install python-for-android fork then Buildozer
      run: |
        python -m venv .venv
        source .venv/bin/activate
        pip install --upgrade pip setuptools wheel
        # Installer le fork capable de mieux gérer les AAR Google (ex: NovemberFall)
        pip install git+https://github.com/NovemberFall/python-for-android.git
        # Puis installer buildozer (qui utilisera la version de p4a déjà installée)
        pip install buildozer cython==0.29.33
        pip install kivy==2.2.1
        pip install kivmob

    - name: Install Android SDK & NDK
      run: |
        mkdir -p $ANDROID_SDK_ROOT
        cd $ANDROID_SDK_ROOT
        curl -s https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d .
        mv cmdline-tools cmdline-tools-temp || true
        mkdir -p cmdline-tools/latest
        mv cmdline-tools-temp/* cmdline-tools/latest || true
        yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
        $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
          "platform-tools" \
          "platforms;android-35" \
          "build-tools;35.0.0" \
          "ndk;25.2.9519653"

    - name: Export env for buildozer
      run: |
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME" >> $GITHUB_ENV
        echo "PATH=$ANDROID_SDK_ROOT/platform-tools:$PATH" >> $GITHUB_PATH

    - name: Copy custom AndroidManifest (optional)
      run: |
        if [ -f app/templates/AndroidManifest.tmpl.xml ]; then
          mkdir -p ./app
          cp app/templates/AndroidManifest.tmpl.xml ./app/AndroidManifest.tmpl.xml || true
          echo "Manifest copied for buildozer packaging."
        fi

    - name: Build with Buildozer
      run: |
        source .venv/bin/activate
        # Ensure buildozer uses local python-for-android installation (already pip-installed)
        build_type=${{ github.event.inputs.build_type }}
        if [ "$build_type" = "release" ]; then
          buildozer android debug deploy run || buildozer android release
        else
          buildozer android debug
        fi

    - name: Collect build outputs
      run: |
        ls -lh ./bin || true
        ls -lh .buildozer || true

    - name: Upload APK / AAB
      uses: actions/upload-artifact@v4
      with:
        name: mon-budget-${{ github.event.inputs.build_type }}
        path: |
          ./bin/*${{ github.event.inputs.build_type }}*.apk
          ./bin/*unsigned*.apk
          ./bin/*.aab
